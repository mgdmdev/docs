  /api/partner/redemptions/quote:
    post:
      operationId: quoteOrderRedemption
      tags: [Order Redemption]
      summary: What a user's points are worth against an order
      description: |
        Read-only. Runs the same arithmetic the reservation will, so a quote and
        the reservation that follows it cannot disagree. Call it on every cart
        change. Never compute a points discount in your own client: the rate is
        per tier and set by mgPass operators.
      security:
        - tenantApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, order_amount]
              properties:
                user_id:
                  type: string
                  example: usr_abc123def456
                order_amount:
                  type: number
                  description: The order total before any points discount, in GHS.
                  example: 500.00
                points:
                  type: integer
                  description: Ask about a specific number of points instead of the maximum.
                  example: 5000
      responses:
        '200':
          description: The quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderRedemptionQuote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/partner/redemptions:
    post:
      operationId: reserveOrderRedemption
      tags: [Order Redemption]
      summary: Spend points against an order
      description: |
        Holds the points and returns the cedi value the order may claim. Charge
        `order_amount - value`.

        The hold lapses at `expires_at` (30 minutes by default, `ttl_seconds` to
        change it) and the platform returns the points itself, so a crashed
        checkout cannot strand a buyer's balance. Settle it anyway.

        `order_reference` is your own order id and is the idempotency key of
        record: a retry returns the original reservation with `replayed: true`
        rather than debiting twice.

        Asking for more points than are spendable returns 400 with the current
        quote in `details.quote`. The amount is never silently clamped.
      security:
        - tenantApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, order_reference, order_amount, points]
              properties:
                user_id:
                  type: string
                  example: usr_abc123def456
                order_reference:
                  type: string
                  description: Your own order id. Unique per application.
                  example: acme-ORD-4821
                order_amount:
                  type: number
                  example: 500.00
                points:
                  type: integer
                  example: 5000
                currency:
                  type: string
                  description: GHS only — the redemption rate is configured in cedis.
                  example: GHS
                metadata:
                  type: object
                  description: Stored on the ledger entry for your own reconciliation.
                ttl_seconds:
                  type: integer
                  description: >
                    How long to hold the points before the platform returns them.
                    Clamped to 300–86400. Defaults to 1800.
                  example: 1800
      responses:
        '200':
          description: Points reserved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OrderRedemption'
                  - type: object
                    properties:
                      replayed:
                        type: boolean
                        description: True when this repeated an earlier reservation.
        '400':
          description: Not enough points, or not permitted for this order and tier
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [insufficient_points, not_eligible, invalid_request, unsupported_currency]
                  message:
                    type: string
                  details:
                    type: object
                    properties:
                      quote:
                        $ref: '#/components/schemas/OrderRedemptionQuote'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/partner/redemptions/{id}/commit:
    post:
      operationId: commitOrderRedemption
      tags: [Order Redemption]
      summary: The order was paid — settle the spend
      description: |
        Moves the redemption to `completed`. No points move; they left at
        reservation. Safe to repeat — a second commit returns `already: true`.
      security:
        - tenantApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: rdm_xyz789
      responses:
        '200':
          description: Settled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderRedemption'
        '404':
          description: No such redemption for this application
        '409':
          description: The redemption is already cancelled or otherwise unsettleable

  /api/partner/redemptions/{id}/void:
    post:
      operationId: voidOrderRedemption
      tags: [Order Redemption]
      summary: The order failed — return the points
      description: |
        Restores the points and moves the redemption to `cancelled`. Safe to
        repeat: the refund is guarded on its own ledger entry, so a double void
        credits once.

        You must call this for any reservation whose payment did not complete,
        including abandoned carts. A reservation left `pending` holds the user's
        points.
      security:
        - tenantApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: rdm_xyz789
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: payment_failed
      responses:
        '200':
          description: Points restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderRedemption'
        '404':
          description: No such redemption for this application
        '409':
          description: The redemption is already committed

