  /api/applications/{id}/subscriptions/sponsor:
    post:
      operationId: sponsorApplicationSubscription
      tags: [Sponsored Subscriptions]
      summary: Admin-grant a sponsored subscription (bypasses Paystack)
      description: |
        Idempotent — a partial unique index on `(application_id, user_id, plan_id, status='active')`
        prevents duplicates. Sponsored subscriptions are excluded from revenue aggregates.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, plan_id]
              properties:
                user_id: { type: string }
                plan_id: { type: string }
                ends_at: { type: [string, "null"], format: date-time }
                reason: { type: string }
                idempotency_key: { type: string }
      responses:
        '201':
          description: Sponsored subscription created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }

