            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Plan' }
    post:
      operationId: createPlan
      tags: [Subscription Plans]
      summary: Create a plan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanCreate' }
      responses:
        '201':
          description: Plan created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }

  /api/subscriptions/plans/{id}:
    get:
      operationId: getPlan
      tags: [Subscription Plans]
      summary: Get a plan
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
    patch:
      operationId: updatePlan
      tags: [Subscription Plans]
      summary: Update a plan
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanUpdate' }
      responses:
        '200':
          description: Updated plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }

  /api/subscriptions:
    get:
      operationId: listSubscriptions
      tags: [Subscriptions]
      summary: List subscriptions (admin)
      parameters:
        - { in: query, name: application_id, schema: { type: string } }
        - { in: query, name: user_id, schema: { type: string } }
        - { in: query, name: plan_id, schema: { type: string } }
        - { in: query, name: state, schema: { $ref: '#/components/schemas/SubscriptionState' } }
        - { in: query, name: limit, schema: { type: integer, default: 50, maximum: 200 } }
        - { in: query, name: cursor, schema: { type: string } }
      responses:
        '200':
          description: Subscriptions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Subscription' }
                  next_cursor: { type: [string, "null"] }

  /api/subscriptions/{id}:
    get:
      operationId: getSubscription
      tags: [Subscriptions]
      summary: Get a subscription
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Subscription.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
    patch:
      operationId: updateSubscription
      tags: [Subscriptions]
      summary: Update a subscription (admin overrides)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                metadata: { type: object, additionalProperties: true }
                billing_email: { type: string, format: email }
                state: { $ref: '#/components/schemas/SubscriptionState' }
      responses:
        '200':
          description: Updated subscription.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }

  /api/subscriptions/{id}/cancel:
    post:
      operationId: adminCancelSubscription
      tags: [Subscriptions]
      summary: Cancel a subscription (admin)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                at_period_end: { type: boolean, default: false }
                reason: { type: string }
      responses:
        '200':
          description: Cancelled subscription.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }

  /api/subscriptions/{id}/refund:
    post:
      operationId: adminRefundSubscriptionPayment
      tags: [Subscriptions]
      summary: Issue a refund against a subscription payment
      description: |
        Calls Paystack's refund API for Paystack-funded payments; falls back to
        a local-only refund row for Hubtel or when no original payment is found.
        Cancels the subscription immediately on success.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: integer, description: 'Refund amount in minor units (pesewas/cents).' }
                reason: { type: string, description: 'Free-form reason; passed to Paystack as merchant_note.' }
                payment_id: { type: string, description: 'Specific payment to refund. If omitted, the most recent succeeded payment is used.' }
      responses:
        '200':
          description: Refund issued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  provider: { type: string, enum: [paystack, hubtel, none] }
                  paystack_refund_id: { type: string, description: 'Paystack refund id, when provider=paystack.' }
                  auto_refund: { type: boolean, description: 'true when the provider was called; false for hubtel/manual.' }
        '502':
          description: Paystack rejected the refund. Subscription is NOT cancelled; no local row written.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code: { type: string, example: paystack_refund_failed }
                      message: { type: string }

