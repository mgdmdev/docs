                  - type: object
                    properties:
                      client_secret: { type: string, description: 'Plaintext client secret, returned once.' }
    patch:
      operationId: updateOauthCapability
      tags: [OAuth Capability]
      summary: Update the OAuth capability
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationOAuthCapability' }
      responses:
