  /api/applications/{id}/webhooks/{webhookId}:
    get:
      operationId: getApplicationWebhook
      tags: [Webhooks]
      summary: Get a webhook
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: webhookId, required: true, schema: { type: string } }
      responses:
        '200':
          description: Webhook.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Webhook' }
    patch:
      operationId: updateApplicationWebhook
      tags: [Webhooks]
      summary: Update a webhook
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
