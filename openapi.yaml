          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationOAuthCapability' }
    delete:
      operationId: disableOauthCapability
      tags: [OAuth Capability]
      summary: Detach the OAuth capability
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
