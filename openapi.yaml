          content:
            application/json:
              schema: { $ref: '#/components/schemas/Webhook' }
    delete:
      operationId: deleteApplicationWebhook
      tags: [Webhooks]
      summary: Delete a webhook
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: webhookId, required: true, schema: { type: string } }
      responses:
        '204': { description: Webhook deleted. }

  /api/applications/{id}/webhooks/{webhookId}/rotate-secret:
    post:
      operationId: rotateApplicationWebhookSecret
      tags: [Webhooks]
      summary: Rotate a webhook's HMAC secret
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: webhookId, required: true, schema: { type: string } }
      responses:
        '200':
          description: New webhook secret (returned once).
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhook_secret: { type: string }
                  rotated_at: { type: string, format: date-time }

