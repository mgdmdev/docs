openapi: 3.1.0
info:
  title: mgPass API
  description: |
    The mgPass platform API powers identity, authentication, rewards, and subscriptions
    across MG Digital products in Ghana and beyond.

    ## Hosts

    | Host                 | Purpose                                                |
    |----------------------|--------------------------------------------------------|
    | `auth.mgpass.net`    | Primary API, OAuth/OIDC, SDK bundles, hosted UI        |
    | `pay.mgpass.net`     | Hosted checkout UI                                      |
    | `console.mgpass.net` | Developer console — register and configure your apps   |
    | `mgpass.net`         | End-user account portal                                |
    | `docs.mgpass.net`    | This documentation site                                |

    ## Unified Applications model

    Every integration in mgPass is an **application** with zero or more
    **capabilities** attached: OAuth, Rewards, and/or Subscriptions. A single
    `application_id` is used across the entire API. A capability is enabled by
    `POST`ing it and disabled by `DELETE`ing it.

    ## Authentication

    Four auth methods are used across the API:

    - **`adminBearer`** — admin user access token with the `mgpass:admin` scope.
      Used for all `/api/*` management endpoints (applications, users, plans,
      subscriptions, promo codes, rewards rules, settings, audit logs, etc.).
    - **`userBearer`** — OAuth access token issued to an end user via OIDC.
      Used for all `/api/account/*` self-service endpoints and `/userinfo`.
    - **`tenantApiKey`** — tenant-issued API key, sent in the `X-API-Key` header.
      Used for the tenant-facing v1 API (`/v1/*`) and the rewards partner ingestion
      endpoint (`POST /api/partner/events`).
    - **`basicClient`** — HTTP Basic auth (client_id : client_secret) for OAuth
      confidential clients calling `POST /token`.

    ## Money

    All money values are integers in **minor units** — pesewas for `GHS`, cents for `USD`.
    Every money-bearing field has a sibling `currency` field (`GHS` or `USD`).

    ## Errors

    Errors share the canonical envelope `{ "error": { "code": string, "message": string, "details"?: object } }`.

  version: "3.0.0"
  contact:
    name: MG Digital Engineering
    email: engineering@mediageneral.com

servers:
  - url: https://auth.mgpass.net
    description: Primary API (auth, management, tenant v1, SDKs)
  - url: https://pay.mgpass.net
    description: Hosted checkout (UI only — no JSON paths)

tags:
  - name: Authentication
    description: OAuth 2.0 / OIDC token, discovery, introspection, revocation.
  - name: User Management
    description: Admin endpoints for creating, updating, and managing user accounts.
  - name: Account Self-Service
    description: End-user endpoints for profile, sessions, MFA, identities, and account export/delete.
  - name: Applications
    description: Manage the unified `applications` spine — every integration is an application.
  - name: OAuth Capability
    description: Attach, update, and rotate the OAuth capability for an application.
  - name: Rewards Capability
    description: Attach, update, and rotate the Rewards capability for an application.
  - name: Subscriptions Capability
    description: Attach, update, and rotate the Subscriptions capability for an application.
  - name: Subscription Plans
    description: Manage subscription plans (admin and tenant v1 surfaces).
  - name: Subscriptions
    description: Subscription lifecycle, state changes, refunds, and audit.
  - name: Checkout
    description: Hosted and embedded checkout sessions.
  - name: Invoices
    description: Invoices generated by the subscriptions engine.
  - name: Payments
    description: Payment attempts and history for subscriptions.
  - name: Promo Codes
    description: Manage promo codes and trial extensions.
  - name: Subscription Seats
    description: Multi-seat plan invites and acceptance.
  - name: Notifications (User)
    description: In-app notification inbox for the authenticated user.
  - name: Notification Preferences
    description: Per-event-type × per-surface preferences for the authenticated user.
  - name: Notification Templates (Admin)
    description: Admin CRUD for email/SMS/in-app notification templates.
  - name: Webhooks
    description: Outbound webhook configuration shared across all capabilities.
  - name: Sponsored Subscriptions
    description: Admin-granted subscriptions that bypass Paystack.
  - name: Revenue Analytics
    description: Revenue, churn, ARPU, and top-plan analytics.
  - name: Rewards Rules
    description: Admin CRUD for rewards points rules.
  - name: Rewards Catalog
    description: Admin CRUD for the rewards redemption catalog.
  - name: Rewards Benefits
    description: Manage tier benefits and tier-gated perks.
  - name: Cashback
    description: Cashback configuration and Paystack callback handling.
  - name: Partner Events
    description: Tenant ingestion of user events for the rewards engine.
  - name: Order Redemption
    description: Spending a user's points against an order in your own checkout.
  - name: Rewards Ledger
    description: Operator search, export and reconciliation over the points ledger.
  - name: Rewards Redemptions
    description: Operator search over every redemption, across all types.
  - name: Payments
    description: One-off charges for an arbitrary amount, separate from subscription billing.
  - name: Roles & Permissions
    description: Manage roles and scope assignments.
  - name: API Resources
    description: Manage API resources and their scopes.
  - name: Organizations
    description: Multi-tenancy organization management.
  - name: Audit Logs
    description: Query the immutable audit log.
  - name: Connectors
    description: Social and email/SMS connectors (Google, Facebook, SES, Hubtel).
  - name: Settings
    description: Global platform settings (sign-in, branding, password policy).
  - name: System Stats
    description: Platform-wide health and usage statistics.
  - name: SDKs
    description: Publicly served JavaScript SDK bundles.

security:
  - adminBearer: []

paths:
  # ─────────────────────────────────────────────────────────────────────────────
  # Authentication / OIDC
  # ─────────────────────────────────────────────────────────────────────────────
  /.well-known/openid-configuration:
    get:
      operationId: getOidcDiscovery
      tags: [Authentication]
      summary: OIDC discovery document
      security: []
      responses:
        '200':
          description: OIDC discovery metadata.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /.well-known/jwks.json:
    get:
      operationId: getJwks
      tags: [Authentication]
      summary: JSON Web Key Set
      security: []
      responses:
        '200':
          description: Active signing keys.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /.well-known/web-identity:
    get:
      operationId: getWebIdentity
      tags: [Authentication]
      summary: FedCM / Web Identity manifest
      security: []
      responses:
        '200':
          description: Web Identity metadata.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /token:
    post:
      operationId: tokenExchange
      tags: [Authentication]
      summary: OAuth 2.0 token endpoint
      description: |
        Exchange an authorization code, refresh token, or client credentials for
        an access token. **Confidential clients MUST authenticate** — send the
        `client_secret` via HTTP Basic (`client_id:client_secret`) or in the
        request body (`client_secret_post`). **Public clients MUST use PKCE**
        (send `code_verifier`; no secret). The `password` (ROPC) grant is
        deprecated and is not offered.
      security:
        - basicClient: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code, refresh_token, client_credentials]
                code: { type: string }
                redirect_uri: { type: string, format: uri }
                code_verifier: { type: string }
                refresh_token: { type: string }
                client_id: { type: string }
                client_secret: { type: string }
                scope: { type: string }
      responses:
        '200':
          description: Token response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400':
          $ref: '#/components/responses/Error'

  /userinfo:
    get:
      operationId: getUserinfo
      tags: [Authentication]
      summary: OIDC userinfo
      security: [{ userBearer: [] }]
      responses:
        '200':
          description: Claims for the authenticated user.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401':
          $ref: '#/components/responses/Error'

  /token/introspect:
    post:
      operationId: introspectToken
      tags: [Authentication]
      summary: RFC 7662 token introspection
      security: [{ basicClient: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                token_type_hint: { type: string, enum: [access_token, refresh_token] }
      responses:
        '200':
          description: Introspection result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  active: { type: boolean }
                  scope: { type: string }
                  client_id: { type: string }
                  username: { type: string }
                  exp: { type: integer }

  /token/revoke:
    post:
      operationId: revokeToken
      tags: [Authentication]
      summary: RFC 7009 token revocation
      security: [{ basicClient: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                token_type_hint: { type: string, enum: [access_token, refresh_token] }
      responses:
        '200': { description: Token revoked (or already invalid). }

  # ─────────────────────────────────────────────────────────────────────────────
  # Account self-service
  # ─────────────────────────────────────────────────────────────────────────────
  /api/account/profile:
    get:
      operationId: getAccountProfile
      tags: [Account Self-Service]
      security: [{ userBearer: [] }]
      summary: Get my profile
      responses:
        '200':
          description: User profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
    patch:
      operationId: updateAccountProfile
      tags: [Account Self-Service]
      security: [{ userBearer: [] }]
      summary: Update my profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserProfileUpdate' }
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }

  /api/account/sessions:
    get:
      operationId: listAccountSessions
      tags: [Account Self-Service]
      security: [{ userBearer: [] }]
      summary: List my active sessions
      responses:
        '200':
          description: Sessions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Session' }
    delete:
      operationId: revokeAllAccountSessions
      tags: [Account Self-Service]
      security: [{ userBearer: [] }]
      summary: Revoke all of my sessions except the current one
      responses:
        '204': { description: Sessions revoked. }

  /api/account/sessions/{sessionId}:
    delete:
      operationId: revokeAccountSession
      tags: [Account Self-Service]
      security: [{ userBearer: [] }]
      summary: Revoke a single session
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string } }
      responses:
        '204': { description: Session revoked. }

  /api/account/identities:
    get:
      operationId: listAccountIdentities
      tags: [Account Self-Service]
      security: [{ userBearer: [] }]
      summary: List my linked social identities
      responses:
        '200':
          description: Linked identities.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Identity' }

  /api/account/identities/{provider}/unlink:
    post:
      operationId: unlinkAccountIdentity
      tags: [Account Self-Service]
      security: [{ userBearer: [] }]
      summary: Unlink a social identity
      parameters:
        - { in: path, name: provider, required: true, schema: { type: string } }
      responses:
        '204': { description: Identity unlinked. }

  /api/account/password:
    post:
      operationId: changeAccountPassword
      tags: [Account Self-Service]
      security: [{ userBearer: [] }]
      summary: Change my password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string }
      responses:
        '204': { description: Password changed. }

  /api/account/apps:
    get:
      operationId: listAccountConnectedApps
      tags: [Account Self-Service]
      security: [{ userBearer: [] }]
      summary: List third-party apps I have authorized
      responses:
        '200':
          description: Connected apps.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConnectedApp' }

  /api/account/apps/{clientId}/revoke:
    post:
      operationId: revokeAccountConnectedApp
      tags: [Account Self-Service]
      security: [{ userBearer: [] }]
      summary: Revoke a connected app's tokens
      parameters:
        - { in: path, name: clientId, required: true, schema: { type: string } }
      responses:
        '204': { description: App revoked. }

  /api/account/mfa/setup:
    post:
      operationId: setupAccountMfa
      tags: [Account Self-Service]
      security: [{ userBearer: [] }]
      summary: Start TOTP MFA enrollment
      responses:
        '200':
          description: Provisioning URI and secret.
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string }
                  otpauth_url: { type: string }
                  qr_code_data_url: { type: string }

  /api/account/mfa/verify:
    post:
      operationId: verifyAccountMfa
      tags: [Account Self-Service]
      security: [{ userBearer: [] }]
      summary: Confirm MFA enrollment with first TOTP code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: Backup codes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  backup_codes:
                    type: array
                    items: { type: string }

  /api/account/mfa:
    delete:
      operationId: disableAccountMfa
      tags: [Account Self-Service]
      security: [{ userBearer: [] }]
      summary: Disable MFA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '204': { description: MFA disabled. }

  /api/account/rewards:
    get:
      operationId: getAccountRewardsSummary
      tags: [Account Self-Service]
      security: [{ userBearer: [] }]
      summary: My rewards balance and tier
      responses:
        '200':
          description: Rewards summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RewardsSummary' }

  /api/account/rewards/history:
    get:
      operationId: getAccountRewardsHistory
      tags: [Account Self-Service]
      security: [{ userBearer: [] }]
      summary: My points ledger
      parameters:
        - { in: query, name: limit, schema: { type: integer, default: 50, maximum: 200 } }
        - { in: query, name: cursor, schema: { type: string } }
      responses:
        '200':
          description: Points ledger entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/PointsLedgerEntry' }
                  total: { type: integer, description: Entries in total, ignoring paging. }

  /api/account/rewards/redemptions:
    get:
      operationId: getAccountRewardsRedemptions
      tags: [Account Self-Service]
      security: [{ userBearer: [] }]
      summary: My catalog redemptions
      responses:
        '200':
          description: Redemptions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Redemption' }

  /api/account/rewards/redeem:
    post:
      operationId: redeemRewardCatalogItem
      tags: [Account Self-Service]
      security: [{ userBearer: [] }]
      summary: Redeem a catalog item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reward_id]
              properties:
                reward_id:
                  type: string
                  description: The catalog item to redeem. Must be active, inside its availability window, and open to the user's tier.
      responses:
        '201':
          description: Redemption created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Redemption' }

  /api/account/cashback/redeem:
    post:
      operationId: redeemCashback
      tags: [Account Self-Service]
      security: [{ userBearer: [] }]
      summary: Redeem cashback to mobile money
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [points, phone_number, network]
              properties:
                points:
                  type: integer
                  minimum: 250
                  description: Points to convert. The platform minimum is 250; a tier may set a higher one.
                phone_number: { type: string, example: '0244123456' }
                network:
                  type: string
                  enum: [mtn, telecel, airteltigo]
                  description: Lowercase. Any other value is rejected.
      responses:
        '201':
          description: The redemption was created and queued for payout.
          content:
            application/json:
              schema:
                type: object
                properties:
                  redemption_id: { type: string }
                  status: { type: string, enum: [pending] }
                  points: { type: integer, description: Points taken from the balance. }
                  tier: { type: string }
                  rate: { type: number, description: Cedis per point at this tier. }
                  gross_amount: { type: number, description: '`points` x `rate`, in cedis.' }
                  fee_rate: { type: number, description: Processing fee as a fraction of the gross. }
                  fee_amount: { type: number, description: The fee in cedis. }
                  net_amount: { type: number, description: What reaches the wallet, in cedis. }

  /api/account/subscriptions:
    get:
      operationId: listAccountSubscriptions
      tags: [Account Self-Service]
      security: [{ userBearer: [] }]
      summary: List my subscriptions
      responses:
        '200':
          description: Subscriptions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Subscription' }

  /api/account/subscriptions/{id}:
    get:
      operationId: getAccountSubscription
      tags: [Account Self-Service]
      security: [{ userBearer: [] }]
      summary: Get one of my subscriptions
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Subscription.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }

  /api/account/subscriptions/{id}/cancel:
    post:
      operationId: cancelAccountSubscription
      tags: [Account Self-Service]
      security: [{ userBearer: [] }]
      summary: Cancel one of my subscriptions
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                at_period_end: { type: boolean, default: true }
                reason: { type: string }
      responses:
        '200':
          description: Updated subscription.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }

  /api/account/subscriptions/{id}/change-plan:
    post:
      operationId: changeAccountSubscriptionPlan
      tags: [Account Self-Service]
      security: [{ userBearer: [] }]
      summary: Change the plan of one of my subscriptions
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id]
              properties:
                plan_id: { type: string }
                proration_mode: { type: string, enum: [credit_now, credit_next_invoice, none], default: credit_now }
      responses:
        '200':
          description: Updated subscription.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }

  /api/account/subscriptions/{id}/upgrade-preview:
    get:
      operationId: previewAccountSubscriptionUpgrade
      tags: [Account Self-Service]
      security: [{ userBearer: [] }]
      summary: Preview the proration for a plan change
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: query, name: plan_id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Proration preview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProrationPreview' }

  /api/account/subscriptions/{id}/seats:
    get:
      operationId: listAccountSubscriptionSeats
      tags: [Account Self-Service]
      security: [{ userBearer: [] }]
      summary: List seats on a multi-seat subscription
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Seats.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Seat' }
  /api/account/subscriptions/{id}/seats/invite:
    post:
      operationId: inviteAccountSubscriptionSeat
      tags: [Account Self-Service]
      security: [{ userBearer: [] }]
      summary: Invite someone to a seat
      description: |
        Only the primary subscriber can invite, only on an `active` or `trialing`
        subscription, and only on a plan that allows more than one seat. The invitee
        receives an email; the seat exists from this call, before they accept.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, example: friend@example.com }
      responses:
        '201':
          description: The seat was created and the invitation sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  seat_id: { type: string }
                  invite_email: { type: string, format: email }
        '400':
          description: |
            `invalid_email` when the address is missing or malformed, `invalid_state`
            when the subscription is not active or trialing, `not_family_plan` when the
            plan allows only one seat, and `self_invite` when the address is the primary
            subscriber's own.
        '403':
          description: '`forbidden` — only the primary subscriber can invite seats.'
        '404':
          description: '`not_found` or `plan_not_found`.'

  /api/account/subscriptions/{id}/seats/{seatId}:
    delete:
      operationId: removeAccountSubscriptionSeat
      tags: [Account Self-Service]
      security: [{ userBearer: [] }]
      summary: Remove a seat
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: path, name: seatId, required: true, schema: { type: string } }
      responses:
        '204': { description: Seat removed. }

  /api/account/seats/accept:
    post:
      operationId: acceptSeatInvite
      tags: [Account Self-Service]
      security: [{ userBearer: [] }]
      summary: Accept a seat invite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_token]
              properties:
                invite_token: { type: string }
      responses:
        '200':
          description: Seat accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Seat' }

  /api/account/notifications:
    get:
      operationId: listAccountNotifications
      tags: [Notifications (User)]
      security: [{ userBearer: [] }]
      summary: List my notifications
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [all, read, unread], default: all } }
        - { in: query, name: category, schema: { $ref: '#/components/schemas/NotificationCategory' } }
        - { in: query, name: limit, schema: { type: integer, default: 50, maximum: 200 } }
        - { in: query, name: cursor, schema: { type: string } }
      responses:
        '200':
          description: Notifications.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  next_cursor: { type: [string, "null"] }

  /api/account/notifications/{id}:
    get:
      operationId: getAccountNotification
      tags: [Notifications (User)]
      security: [{ userBearer: [] }]
      summary: Get one notification
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Notification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
    patch:
      operationId: updateAccountNotification
      tags: [Notifications (User)]
      security: [{ userBearer: [] }]
      summary: Mark notification read or unread
      parameters:
