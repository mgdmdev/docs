  /api/subscriptions/stats:
    get:
      operationId: getSubscriptionStats
      tags: [Revenue Analytics]
      summary: Revenue and churn analytics
      description: |
        Returns daily revenue sparkline, top plans by MRR, 30-day churn rate, 30-day ARPU,
        and 30-day refund volume. Sponsored subscriptions are excluded from monetary aggregates.
