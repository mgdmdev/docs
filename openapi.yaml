  # ─────────────────────────────────────────────────────────────────────────────
  # SDKs
  # ─────────────────────────────────────────────────────────────────────────────
  /sdk/onetap.js:
    get:
      operationId: getOneTapSdk
      tags: [SDKs]
      security: []
      summary: One-Tap sign-in SDK bundle
      description: |
        Public JS bundle exposing `window.mgpass.onetap({ client_id, callback, login_url })`.
        On Chromium it runs the native FedCM account chooser; on Safari/Firefox (no
        FedCM) it shows a "Continue with mgPass" card that redirects to `login_url`.
      responses:
        '200':
          description: JS bundle.
          content:
            text/javascript:
              schema: { type: string }

  /sdk/checkout.js:
    get:
      operationId: getCheckoutSdk
      tags: [SDKs]
      security: []
      summary: Embeddable checkout SDK bundle
      description: |
        Public, 1-hour-cached JS bundle that exposes `window.mgpass.checkout.open(options)`.
        Use `GET /sdk/checkout.js.sri` to pin an SRI hash for `<script integrity>`.
      responses:
        '200':
          description: JS bundle.
          content:
            text/javascript:
              schema: { type: string }

  /sdk/checkout.js.sri:
    get:
      operationId: getCheckoutSdkSri
      tags: [SDKs]
      security: []
      summary: Checkout SDK SRI hash
      responses:
        '200':
          description: SRI metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  integrity: { type: string, description: 'e.g. "sha384-..."' }
                  bundle_version: { type: string }

  # ──── User Management: roles, sessions, identities ────

  /api/users/{id}/unsuspend:
    post:
      operationId: unsuspendUser
      tags: [User Management]
      security: [{ adminBearer: [] }]
      summary: Lift a suspension
      description: Clears `is_suspended` and the stored suspension reason. Idempotent — unsuspending an active user succeeds and changes nothing.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, example: usr_abc123 }
      responses:
        '200':
          description: The user is no longer suspended.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/users/{id}/roles:
    post:
      operationId: assignUserRole
      tags: [Roles & Permissions]
      security: [{ adminBearer: [] }]
      summary: Assign a role to a user
      description: Records who assigned the role and when. A role already held is rejected rather than re-inserted.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, example: usr_abc123 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_id]
              properties:
                role_id: { type: string, example: role_support_agent }
      responses:
        '201':
          description: Role assigned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No role with that id.
        '409':
          description: The user already holds this role.

  /api/users/{id}/roles/{roleId}:
    delete:
      operationId: removeUserRole
      tags: [Roles & Permissions]
      security: [{ adminBearer: [] }]
      summary: Remove a role from a user
      description: Idempotent — removing a role the user does not hold succeeds and changes nothing.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, example: usr_abc123 }
        - { name: roleId, in: path, required: true, schema: { type: string }, example: role_support_agent }
      responses:
        '200':
          description: Role removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/users/{id}/sessions:
    get:
      operationId: listUserSessions
      tags: [User Management]
      security: [{ adminBearer: [] }]
      summary: List a user's active sessions
      description: One row per live session, newest activity first, with the Application each session belongs to.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, example: usr_abc123 }
      responses:
        '200':
          description: The user's sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    client_id:
                      type: string
                      description: The `application_id` this session was created for. Named `client_id` for parity with the account portal's sessions contract.
                    client_name: { type: string }
                    client_logo_url: { type: [string, 'null'] }
                    device_info:
                      type: [object, 'null']
                      additionalProperties: true
                      description: Parsed user-agent details, when the session recorded any.
                    ip_address: { type: [string, 'null'] }
                    last_active_at: { type: integer }
                    created_at: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/users/{id}/sessions/revoke-all:
    post:
      operationId: revokeAllUserSessions
      tags: [User Management]
      security: [{ adminBearer: [] }]
      summary: Revoke every session and refresh token for a user
      description: |
        Signs the user out everywhere: all sessions are revoked, all refresh tokens
        are revoked, and a back-channel logout is dispatched so the account and
        admin surfaces drop their local cookies immediately.

        Rate limited to **5 requests per minute** per admin.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, example: usr_abc123 }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
                  description: Optional note written to the audit record. Trimmed, and truncated at 500 characters.
                  example: Credential compromise reported by the user
      responses:
        '200':
          description: Everything revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  revoked_sessions: { type: integer, example: 3 }
                  revoked_refresh_tokens: { type: integer, example: 7 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/users/{id}/identities:
    get:
      operationId: listUserIdentities
      tags: [User Management]
      security: [{ adminBearer: [] }]
      summary: List a user's linked social identities
      description: Newest link first. One row per provider account linked to this user.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, example: usr_abc123 }
      responses:
        '200':
          description: The user's linked identities.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    user_id: { type: string }
                    provider: { type: string, example: google }
                    provider_user_id:
                      type: string
                      description: The user's id at the provider.
                    profile_data:
                      type: [object, 'null']
                      additionalProperties: true
                      description: The provider profile captured at link time, parsed from storage.
                    created_at: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/users/{id}/login-history:
    get:
      operationId: getUserLoginHistory
      tags: [User Management]
      security: [{ adminBearer: [] }]
      summary: Recent sign-in activity for a user
      description: |
        Audit records for this user narrowed to sign-in events: `session.created`,
        `user.login.success`, `user.login.failed` and `user.sign_out`. Newest first.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, example: usr_abc123 }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
          description: Rows to return. Values above 50 are reduced to 50.
      responses:
        '200':
          description: Sign-in events, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditLogEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ──── Rewards administration: ledger, redemptions, reconciliation ────

  /api/rewards/ledger:
    get:
      operationId: searchPointsLedger
      tags: [Rewards Ledger]
      security: [{ adminBearer: [] }]
      summary: Search the points ledger
      description: |
        Every points movement, newest first, with the holder's name and email joined in.
        Filters combine with AND. Passing `user_email` for an address that matches no
        user returns an empty page rather than an error.
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
          description: Values above 100 are reduced to 100.
        - { name: user_id, in: query, schema: { type: string } }
        - name: user_email
          in: query
          schema: { type: string }
          description: Resolved to a user id. Ignored when `user_id` is also sent.
        - { name: platform, in: query, schema: { type: string }, example: 3news }
        - { name: event_type, in: query, schema: { type: string }, example: purchase }
        - { name: from, in: query, schema: { type: integer }, description: 'Unix epoch seconds, inclusive.' }
        - { name: to, in: query, schema: { type: integer }, description: 'Unix epoch seconds, inclusive.' }
      responses:
        '200':
          description: Matching ledger entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/PointsLedgerEntry' }
                  total: { type: integer, description: 'Rows matching the filters, ignoring paging.' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/rewards/ledger/export:
    get:
      operationId: exportPointsLedger
      tags: [Rewards Ledger]
      security: [{ adminBearer: [] }]
      summary: Export the points ledger as CSV
      description: |
        The same filters as the ledger search, with no paging — the whole matching set
        is written out. Returns `text/csv` as an attachment named `ledger-export.csv`,
        with the header row `ID,User,Email,Event,Platform,Points,Date`.
      parameters:
        - { name: user_id, in: query, schema: { type: string } }
        - { name: user_email, in: query, schema: { type: string } }
        - { name: platform, in: query, schema: { type: string } }
        - { name: event_type, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: integer } }
        - { name: to, in: query, schema: { type: integer } }
      responses:
        '200':
          description: CSV export.
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/rewards/redemptions:
    get:
      operationId: listAllRedemptions
      tags: [Rewards Redemptions]
      security: [{ adminBearer: [] }]
      summary: Search redemptions across all users
      description: |
        Every redemption — catalog, cashback and order — newest first, with the
        holder's name and email joined in. Filters combine with AND. Passing `q` for
        an address that matches no user returns an empty page rather than an error.
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
          description: Values above 100 are reduced to 100.
        - name: status
          in: query
          schema: { type: string, enum: [pending, processing, completed, failed, cancelled] }
        - name: type
          in: query
          schema: { type: string, enum: [catalog, cashback, partner_order] }
          description: Which kind of redemption to return.
        - name: q
          in: query
          schema: { type: string }
          description: An exact user email address.
        - { name: from, in: query, schema: { type: integer }, description: 'Unix epoch seconds, inclusive.' }
        - { name: to, in: query, schema: { type: integer }, description: 'Unix epoch seconds, inclusive.' }
      responses:
        '200':
          description: Matching redemptions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: { type: array, items: { type: object, additionalProperties: true } }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/rewards/cashback/redemptions/{id}:
    patch:
      operationId: settleCashbackRedemption
      tags: [Cashback]
      security: [{ adminBearer: [] }]
      summary: Approve or reject a cashback redemption
      description: |
        Only a redemption still `pending` or `processing` can be settled. Cancelling
        writes a positive `cashback_refund` entry to the ledger, returning the points
        to the user; completing does not move points, because they left at request time.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, example: rdm_xyz789 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [completed, cancelled] }
                reason: { type: string, description: Optional note recorded with the decision. }
      responses:
        '200':
          description: The redemption was settled.
        '400':
          description: '`invalid_request` when `status` is absent or not one of the two values; `invalid_state` when the redemption is no longer pending or processing.'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No redemption with that id.

  /api/rewards/reconcile/{userId}:
    post:
      operationId: reconcileUserBalance
      tags: [Rewards Ledger]
      security: [{ adminBearer: [] }]
      summary: Reconcile a user's cached balance against the ledger
      description: |
        Sums the user's ledger and compares it with the cached balance. If they differ,
        the cache is corrected to the ledger total and the correction is audited. The
        ledger is the source of truth; the cached balance is never trusted over it.
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string }, example: usr_abc123 }
      responses:
        '200':
          description: The comparison, and whether a correction was applied.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cached: { type: integer, description: The balance before reconciliation. }
                  calculated: { type: integer, description: The sum of the user's ledger. }
                  drift: { type: integer, description: '`cached` minus `calculated`. Zero when the two agree.' }
                  fixed: { type: boolean, description: True when the cached balance was corrected. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ──── API resources, audit, organization members ────

  /api/api-resources:
    get:
      operationId: listApiResources
      tags: [API Resources]
      security: [{ adminBearer: [] }]
      summary: List API resources
      description: An API resource is an audience that access tokens can be issued for, with its own scopes and token lifetime.
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
          description: Values above 100 are reduced to 100.
      responses:
        '200':
          description: A page of API resources.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ApiResource' } }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  has_more: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createApiResource
      tags: [API Resources]
      security: [{ adminBearer: [] }]
      summary: Create an API resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, identifier]
              properties:
                name: { type: string, example: Orders API }
                identifier:
                  type: string
                  description: The audience value tokens will carry. Conventionally a URI.
                  example: https://api.acme.com
                token_ttl:
                  type: integer
                  description: Access-token lifetime in seconds for this audience.
                  example: 3600
      responses:
        '201':
          description: The new API resource.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResource' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/api-resources/{id}:
    get:
      operationId: getApiResource
      tags: [API Resources]
      security: [{ adminBearer: [] }]
      summary: Get an API resource with its scopes
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, example: res_orders }
      responses:
        '200':
          description: The API resource, with every scope defined on it.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiResource' }
                  - type: object
                    properties:
                      scopes: { type: array, items: { $ref: '#/components/schemas/ApiScope' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No API resource with that id.

  /api/api-resources/{id}/scopes:
    post:
      operationId: addApiResourceScope
      tags: [API Resources]
      security: [{ adminBearer: [] }]
      summary: Add a scope to an API resource
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, example: res_orders }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: 'orders:read' }
                description: { type: string, example: Read orders on behalf of the user. }
      responses:
        '201':
          description: The new scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiScope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/audit:
    get:
      operationId: listAuditLogs
      tags: [Audit Logs]
      security: [{ adminBearer: [] }]
      summary: Search the audit log
      description: |
        Platform-wide audit records, newest first. Filters combine with AND. Actor and
        target names are resolved into the response where the referenced record still exists.
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
          description: Values above 100 are reduced to 100.
        - { name: event_type, in: query, schema: { type: string }, example: role.assigned }
        - { name: actor_id, in: query, schema: { type: string } }
        - { name: target_id, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: integer }, description: 'Unix epoch seconds, inclusive.' }
        - { name: to, in: query, schema: { type: integer }, description: 'Unix epoch seconds, inclusive.' }
      responses:
        '200':
          description: Matching audit records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: { type: array, items: { $ref: '#/components/schemas/AuditLogEntry' } }
                  total: { type: integer, description: 'Rows matching the filters, ignoring paging.' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/organizations/{id}/members:
    post:
      operationId: addOrganizationMember
      tags: [Organizations]
      security: [{ adminBearer: [] }]
      summary: Add a user to an organization
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, example: org_acme }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string, example: usr_abc123 }
                role:
                  type: string
                  description: Optional role within the organization. Stored as null when omitted.
                  example: owner
      responses:
        '201':
          description: The user is now a member.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        '400':
          description: '`invalid_request` — `user_id` is missing.'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '`user_not_found` — no live user with that id.'

  # ──── RP-initiated logout ────

  /logout:
    get:
      operationId: rpInitiatedLogoutGet
      tags: [Authentication]
      summary: End the session (RP-initiated logout)
      description: |
        Clears the mgPass session cookie and emits the `Set-Login` header so the browser
        re-queries the accounts endpoint.

        `post_logout_redirect_uri` is honoured only when it matches one of the
        Application's registered `post_logout_uris` exactly; anything else is ignored and
        the response is JSON instead of a redirect. Sessions belonging to *other*
        Applications are revoked only when `id_token_hint` is present and its signature
        verifies — a forged hint clears the caller's own cookie and nothing more.

        The `POST` form of this endpoint accepts the same three values as a JSON or form
        body, for callers that would rather not put a token in a query string.
      parameters:
        - name: id_token_hint
          in: query
          schema: { type: string }
          description: The ID token from the session being ended. Required for cross-Application sign-out.
        - name: post_logout_redirect_uri
          in: query
          schema: { type: string }
          description: Where to send the browser afterwards. Must match a registered URI exactly.
        - name: client_id
          in: query
          schema: { type: string }
          description: The Application requesting the logout.
      responses:
        '302':
          description: Redirect to the validated `post_logout_redirect_uri`.
        '200':
          description: No valid redirect was supplied, so the result is returned as JSON.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }

  # ──── FedCM (browser-invoked; Chromium only) ────

  /fedcm/config.json:
    get:
      operationId: fedcmConfig
      tags: [Authentication]
      summary: FedCM provider configuration
      description: |
        The provider manifest the browser fetches first. Not called by your code — the
        browser requests it when a page calls `navigator.credentials.get()` with an
        identity provider pointing at mgPass.
      responses:
        '200':
          description: The provider manifest.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts_endpoint: { type: string, example: /fedcm/accounts }
                  id_assertion_endpoint: { type: string, example: /fedcm/assertion }
                  client_metadata_endpoint: { type: string, example: /fedcm/client-metadata }
                  login_url: { type: string, example: /authorize }
                  branding:
                    type: object
                    properties:
                      background_color: { type: string }
                      color: { type: string }
                      icons:
                        type: array
                        items:
                          type: object
                          properties:
                            url: { type: string }
                            size: { type: integer }

  /fedcm/accounts:
    get:
      operationId: fedcmAccounts
      tags: [Authentication]
      summary: FedCM account list
      description: |
        The signed-in account, as the browser's account chooser needs it. Sent with
        credentials and no `Origin` header, so the browser must supply
        `Sec-Fetch-Dest: webidentity` — requests without it are rejected.

        `approved_clients` lists the Applications this user has already consented to, read
        from the durable consent record union'd with live refresh-token grants. The browser
        uses it to decide whether to show a consent step.
      parameters:
        - name: Sec-Fetch-Dest
          in: header
          required: true
          schema: { type: string, enum: [webidentity] }
      responses:
        '200':
          description: The signed-in account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        email: { type: string }
                        picture: { type: string }
                        approved_clients: { type: array, items: { type: string } }
        '400':
          description: '`invalid_request` — the `Sec-Fetch-Dest: webidentity` header was absent.'

  /fedcm/assertion:
    post:
      operationId: fedcmAssertion
      tags: [Authentication]
      summary: FedCM ID assertion
      description: |
        Issues an ID token for the account the user picked in the browser's chooser. Sent
        as a form body by the browser, which must supply `Sec-Fetch-Dest: webidentity`.
        The session cookie must belong to `account_id`, and consent is recorded so the
        Application shows as approved next time and silent SSO works for it.
      parameters:
        - name: Sec-Fetch-Dest
          in: header
          required: true
          schema: { type: string, enum: [webidentity] }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [account_id, client_id]
              properties:
                account_id: { type: string }
                client_id:
                  type: string
                  description: The `application_id` of the relying party.
      responses:
        '200':
          description: The ID token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: A signed ID token. }
        '400':
          description: The `Sec-Fetch-Dest` header, `account_id` or `client_id` was missing.

  /fedcm/client-metadata:
    get:
      operationId: fedcmClientMetadata
      tags: [Authentication]
      summary: FedCM relying-party metadata
      description: |
        The terms and privacy links the browser shows in its consent UI, taken from the
        Application's branding and falling back to the mgPass defaults. Requires
        `Sec-Fetch-Dest: webidentity`. An empty object is returned when `client_id` is absent.
      parameters:
        - name: Sec-Fetch-Dest
          in: header
          required: true
          schema: { type: string, enum: [webidentity] }
        - { name: client_id, in: query, schema: { type: string } }
      responses:
        '200':
          description: The relying party's terms and privacy URLs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  privacy_policy_url: { type: string }
                  terms_of_service_url: { type: string }
        '400':
          description: '`invalid_request` — the `Sec-Fetch-Dest: webidentity` header was absent.'

  # ──── One-off payments ────

  /v1/payments:
    post:
      operationId: createOneOffPayment
      tags: [Payments]
      security: [{ tenantApiKey: [] }]
      summary: Charge an arbitrary amount
      description: |
        A single charge for an amount you decide — a ticket, an order, a top-up.
        Unlike checkout, nothing here is derived from a plan.

        **The amount you send is the amount charged.** It is stored exactly as
        received and never recomputed, so a total you worked out server-side
        (after a promo code, a points discount, or both) survives intact.

        `channel: mobile_money` charges the wallet directly and returns
        `display_text` for the prompt the buyer is about to see. Every other
        channel returns an `authorization_url` to send them to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference, amount, customer_email]
              properties:
                reference:
                  type: string
                  description: Your own order id, and the idempotency key of record. A retry returns the original payment rather than charging twice.
                  example: acme-ORD-4821
                amount:
                  type: integer
                  description: Minor units — pesewas for GHS, cents for USD. A decimal is refused rather than rounded.
                  example: 46000
                currency: { type: string, enum: [GHS, USD], default: GHS }
                customer_email:
                  type: string
                  format: email
                  description: Required on every charge, including mobile money — Paystack requires it.
                customer_phone:
                  type: string
                  description: Required when `channel` is `mobile_money`.
                  example: '0244123456'
                channel:
                  type: string
                  enum: [card, mobile_money, bank, ussd, bank_transfer]
                  default: card
                momo_provider:
                  type: string
                  enum: [mtn, vod, atl]
                  description: Required when `channel` is `mobile_money`. `vod` is Telecel, `atl` is AirtelTigo.
                user_id:
                  type: string
                  description: The mgPass user, when you know who this is. Omit for guest checkout.
                description: { type: string }
                metadata:
                  type: object
                  additionalProperties: true
                callback_url:
                  type: string
                  description: Where the payer returns after a hosted channel.
                subaccount:
                  type: string
                  description: Settle a share directly to this Paystack subaccount instead of the platform balance.
                split_code:
                  type: string
                  description: A pre-built Paystack split group, as an alternative to `subaccount`.
                platform_fee:
                  type: integer
                  description: >
                    Flat fee in minor units retained when a split applies. Cannot exceed
                    `amount`. REQUIRED whenever `subaccount` or `split_code` is set —
                    send 0 to take no fee. Omitting it would fall back to the
                    destination's stored percentage, so an absent value is refused
                    rather than guessed at.
                ttl_seconds:
                  type: integer
                  default: 3600
                  description: How long the charge may stay pending before it is swept to `abandoned`. Clamped to 300–86400.
      responses:
        '201':
          description: The charge was started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OneOffPayment' }
        '200':
          description: This `reference` already had a payment. The original is returned with `replayed` true and the provider was not called again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OneOffPayment' }
        '400':
          description: >
            `invalid_request`, `invalid_amount`, `invalid_momo_provider`,
            `unsupported_currency`, or `platform_fee_required` when a split is
            requested without a flat fee.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: '`channel_not_allowed` — that channel is not enabled for this Application.'
        '429': { $ref: '#/components/responses/RateLimited' }
        '502':
          description: '`provider_error` — the payment provider refused. The payment is recorded as failed with the reason, and `details.payment_id` identifies it.'
    get:
      operationId: listOneOffPayments
      tags: [Payments]
      security: [{ tenantApiKey: [] }]
      summary: List payments
      description: Your Application's payments, newest first.
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
          description: Values above 100 are reduced to 100.
        - name: status
          in: query
          schema: { type: string, enum: [pending, succeeded, failed, abandoned, refunded] }
      responses:
        '200':
          description: Matching payments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: { type: array, items: { $ref: '#/components/schemas/OneOffPayment' } }
                  total: { type: integer, description: 'Payments matching the filter, ignoring paging.' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/payments/by-reference/{reference}:
    get:
      operationId: getOneOffPaymentByReference
      tags: [Payments]
      security: [{ tenantApiKey: [] }]
      summary: Get a payment by your own reference
      description: For recovering from a lost response without retrying blind.
      parameters:
        - { name: reference, in: path, required: true, schema: { type: string }, example: acme-ORD-4821 }
      responses:
        '200':
          description: The payment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OneOffPayment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No payment with that reference for this Application.

  # ──── Payout destinations ────

  /v1/payout-destinations:
    post:
      operationId: createPayoutDestination
      tags: [Payments]
      security: [{ tenantApiKey: [] }]
      summary: Register where money settles
      description: |
        Creates a payout destination — a bank account or mobile money wallet that a
        payment's share can settle to directly, without passing through the platform
        balance.

        Pass the returned `subaccount` on a payment to split it.

        This models a place money goes, nothing more. Who it belongs to — an organiser,
        a vendor, a merchant — is your concept, not ours. mgPass stores the destination
        against your own `reference` and never learns what is on the other end.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference, business_name, settlement_bank, account_number]
              properties:
                reference:
                  type: string
                  description: Your own id for whoever this pays. Idempotency key — a repeat returns the first destination rather than creating a second.
                  example: organizer-4821
                business_name:
                  type: string
                  description: The payee's business name, as it should appear to the payment provider.
                destination_type:
                  type: string
                  enum: [bank, mobile_money]
                  default: bank
                settlement_bank:
                  type: string
                  description: A bank or wallet code from `GET /v1/banks`. Not the same namespace as `momo_provider` on a charge.
                account_number:
                  type: string
                  description: Account or wallet number. Only the last four digits are retained — the provider holds the rest.
                currency: { type: string, enum: [GHS, USD], default: GHS }
                subaccount_percentage:
                  type: number
                  default: 100
                  description: >
                    Percentage of each payment the PAYEE receives; the remainder is
                    retained. Defaults to 100. A flat `platform_fee` on the payment
                    overrides this, and is the recommended way to take a fee — this
                    percentage only applies if a payment omits one.
                  minimum: 0
                  maximum: 100
                contact_email: { type: string, format: email }
                contact_name: { type: string }
                description: { type: string }
      responses:
        '201':
          description: The destination was created. `notice` carries the verification-hold warning.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutDestination' }
        '200':
          description: This `reference` already had a destination; the original is returned with `replayed` true.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutDestination' }
        '400':
          description: '`invalid_request` for a missing field, or `wallet_not_settleable` when an AirtelTigo wallet is offered as a payout destination.'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502':
          description: '`provider_error` — the payment provider rejected the account details.'
    get:
      operationId: listPayoutDestinations
      tags: [Payments]
      security: [{ tenantApiKey: [] }]
      summary: List payout destinations
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
          description: Values above 100 are reduced to 100.
      responses:
        '200':
          description: Your Application's payout destinations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: { type: array, items: { $ref: '#/components/schemas/PayoutDestination' } }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/payout-destinations/by-reference/{reference}:
    get:
      operationId: getPayoutDestinationByReference
      tags: [Payments]
      security: [{ tenantApiKey: [] }]
      summary: Get a payout destination by your own reference
      parameters:
        - { name: reference, in: path, required: true, schema: { type: string }, example: organizer-4821 }
      responses:
        '200':
          description: The destination.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutDestination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No payout destination with that reference.

  /v1/banks:
    get:
      operationId: listSettlementBanks
      tags: [Payments]
      security: [{ tenantApiKey: [] }]
      summary: Banks and wallets that can receive a settlement
      description: |
        Fetched live from the payment provider, so a code is never stale.

        Wallets that cannot receive a payout are filtered out — notably AirtelTigo,
        which can be charged but not settled to. A picker built from this list cannot
        offer an option that would be rejected later.
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [mobile_money] }
          description: Omit for banks; `mobile_money` for wallets.
        - { name: country, in: query, schema: { type: string, default: ghana } }
      responses:
        '200':
          description: Settleable destinations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string, example: MTN Mobile Money }
                        code: { type: string, example: MTN }
                        type: { type: string }
                        currency: { type: string }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { description: '`provider_error` — the provider could not be reached.' }

  /api/applications/{id}/capabilities/payments:
    post:
      operationId: enablePaymentsCapability
      tags: [Applications]
      security: [{ adminBearer: [] }]
      summary: Enable the Payments capability
      description: |
        Adds one-off payments to an Application and issues its API key. The key is
        returned once and never again.

        `settlement_mode` is required. There is no default, because the only possible
        default is "the platform balance" — and an Application whose money we hold
        because a field was omitted is the situation splits exist to prevent.

        With `destination`, the payout destination is created in the same call, so the
        Application cannot end up in that mode pointing at nothing.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, example: app_acme }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settlement_mode]
              properties:
                settlement_mode:
                  type: string
                  enum: [destination, per_payment, platform]
                  description: '`destination` — all money to one payout destination. `per_payment` — a subaccount supplied on each charge. `platform` — money stays in the platform balance; only correct when the platform is the payee.'
                default_payout:
                  type: object
                  description: Required when `settlement_mode` is `destination`. The destination is created with the payment provider as part of this call.
                  required: [business_name, settlement_bank, account_number]
                  properties:
                    reference: { type: string, description: 'Defaults to the Application slug plus `-default`.' }
                    business_name: { type: string }
                    destination_type: { type: string, enum: [bank, mobile_money], default: bank }
                    settlement_bank: { type: string, description: A bank or wallet code. AirtelTigo is refused — it cannot receive settlements. }
                    account_number: { type: string, description: Only the last four digits are retained. }
                    subaccount_percentage:
                      type: number
                      default: 100
                      description: Percentage the payee receives. Defaults to 100 so a payment that omits its flat fee overpays the payee rather than paying them nothing.
                default_platform_fee:
                  type: [integer, 'null']
                  description: Flat fee in minor units retained on each split payment, when the charge does not specify one.
                allowed_channels:
                  type: [array, 'null']
                  items: { type: string, enum: [card, mobile_money, bank, ussd, bank_transfer] }
                  description: Null means all. An Application that only wants mobile money can say so once here.
                statement_descriptor: { type: [string, 'null'], description: What the payer sees on their statement or prompt. }
                is_active: { type: boolean, default: true }
      responses:
        '201':
          description: Enabled. `api_key` is shown once; `notice` explains the settlement consequence of the mode chosen.
          content:
            application/json:
              schema:
                type: object
                properties:
                  application_id: { type: string }
                  settlement_mode: { type: string, enum: [destination, per_payment, platform] }
                  default_subaccount: { type: [string, 'null'] }
                  default_platform_fee: { type: [integer, 'null'] }
                  allowed_channels: { type: [string, 'null'] }
                  statement_descriptor: { type: [string, 'null'] }
                  is_active: { type: integer }
                  created_at: { type: integer }
                  api_key: { type: string, description: Returned once. Store it now — it cannot be retrieved later. }
                  notice: { type: [string, 'null'] }
        '400':
          description: '`settlement_mode_required` when absent or invalid, `payout_destination_required` when `destination` is chosen without one, `wallet_not_settleable` for an AirtelTigo payout wallet.'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No Application with that id. }
        '409': { description: '`capability_exists` — already enabled. Use PATCH.' }
        '502': { description: '`provider_error` — the payout destination could not be created.' }
    patch:
      operationId: updatePaymentsCapability
      tags: [Applications]
      security: [{ adminBearer: [] }]
      summary: Update the Payments capability
      description: |
        Changing to `settlement_mode: destination` is refused unless a default
        destination already exists or `default_payout` is supplied alongside — the pair
        has to move together, or the Application is left charging with nowhere to settle.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                settlement_mode: { type: string, enum: [destination, per_payment, platform] }
                default_platform_fee: { type: [integer, 'null'] }
                allowed_channels: { type: [array, 'null'], items: { type: string } }
                statement_descriptor: { type: [string, 'null'] }
                is_active: { type: boolean }
      responses:
        '200': { description: The updated capability. }
        '400': { description: '`no_fields` or `payout_destination_required`.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Capability not enabled for this Application. }
    delete:
      operationId: disablePaymentsCapability
      tags: [Applications]
      security: [{ adminBearer: [] }]
      summary: Disable the Payments capability
      description: |
        Removes the capability row, which revokes the API key immediately — capability
        presence is the row existing. Payments already recorded are not deleted.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Disabled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Capability not enabled for this Application. }

  /api/applications/{id}/capabilities/payments/rotate-key:
    post:
      operationId: rotatePaymentsKey
      tags: [Applications]
      security: [{ adminBearer: [] }]
      summary: Rotate the Payments API key
      description: |
        Issues a new key and invalidates the old one immediately. There is no overlap
        window, so deploy the new key before rotating.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The new key, shown once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Capability not enabled for this Application. }

components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Admin user access token with the `mgpass:admin` scope.
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth access token issued to an end user.
    tenantApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Tenant API key for v1 endpoints and rewards partner ingestion.
    basicClient:
      type: http
      scheme: basic
      description: 'HTTP Basic — confidential OAuth client (client_id : client_secret).'

  responses:
    Error:
      description: Standard error envelope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: invalid_request }
              message: { type: string }
              details:
                type: object
                additionalProperties: true
                description: Extra context for the code, when the endpoint provides any.

    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: unauthorized }
              message: { type: string }

    RateLimited:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: rate_limit_exceeded }
              message: { type: string }

  schemas:
    Error:
      type: object
      description: >
        The standard error envelope, flat rather than nested. This is what the
        platform's single error helper emits across 347 call sites, and it
        matches the contract in the API conventions guide. The FedCM endpoints
        are the one exception: they return the nested shape their specification
        mandates.
      required: [error]
      properties:
        error:
          type: string
          description: Stable snake_case code. Switch on this.
          example: invalid_request
        message:
          type: string
          description: >
            Human-readable detail. Safe to surface to operators; do not show it
            raw to end users, as it can name fields.
          example: plan_id is required.
        details:
          type: object
          additionalProperties: true
          description: >
            Extra context where the endpoint provides any — for example
            `details.quote` on a rejected order redemption.

    TokenResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer }
        refresh_token: { type: string }
        id_token: { type: string }
        scope: { type: string }

    UserProfile:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        email_verified: { type: boolean }
        phone: { type: [string, "null"] }
        phone_verified: { type: boolean }
        name: { type: [string, "null"] }
        given_name: { type: [string, "null"] }
        family_name: { type: [string, "null"] }
        picture: { type: [string, "null"], format: uri }
        locale: { type: [string, "null"] }
        mfa_enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UserProfileUpdate:
      type: object
      properties:
        name: { type: string }
        given_name: { type: string }
        family_name: { type: string }
        phone: { type: string }
        locale: { type: string }
        picture: { type: string, format: uri }

    Session:
      type: object
      properties:
        id: { type: string }
        device_info:
          type: [object, 'null']
          additionalProperties: true
          description: Device details recorded at sign-in, returned parsed.
        ip_address: { type: [string, 'null'] }
        client_name:
          type: string
          description: Display name of the Application the session belongs to.
        client_logo_url: { type: [string, 'null'] }
        last_active_at: { type: integer, description: Unix epoch seconds. }
        created_at: { type: integer, description: Unix epoch seconds. }

    Identity:
      type: object
      properties:
        id: { type: string }
        provider: { type: string, example: google }
        provider_user_id:
          type: string
          description: The user's id at that provider. Stable across sign-ins.
        profile_data:
          type: object
          additionalProperties: true
          description: The provider profile captured at link time, returned parsed. An empty object when none was stored.
        created_at: { type: integer, description: Unix epoch seconds. }

    ConnectedApp:
      type: object
      properties:
        client_id: { type: string }
        application_id: { type: string }
        name: { type: string }
        logo_url: { type: [string, "null"], format: uri }
        scopes:
          type: array
          items: { type: string }
        first_authorized_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }

    User:
      type: object
      properties:
        id: { type: string }
        email: { type: [string, 'null'], format: email }
        email_verified: { type: boolean }
        phone: { type: [string, 'null'] }
        phone_verified: { type: boolean }
        name: { type: [string, 'null'] }
        avatar_url: { type: [string, 'null'] }
        custom_data:
          type: object
          additionalProperties: true
          description: Arbitrary JSON you store against the user, returned parsed. An empty object when none was set.
        is_suspended: { type: boolean }
        suspension_reason: { type: [string, 'null'] }
        created_at:
          type: string
          format: date-time
          description: ISO 8601. This endpoint returns timestamps as strings, not the epoch seconds used elsewhere in the API.
        last_sign_in_at:
          type: [string, 'null']
          format: date-time
          description: ISO 8601. Derived from the most recent session when the column was never stamped.
        deleted_at: { type: [string, 'null'], format: date-time }
        roles:
          type: array
          items: { type: string }
          description: Returned by the single-user endpoint, not by the list.

    UserCreate:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        name: { type: string }
        phone: { type: string }

    Organization:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        logo_url: { type: [string, "null"], format: uri }
        created_at: { type: string, format: date-time }

    Role:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        type:
          type: string
          enum: [user, m2m]
          description: '`user` roles are assigned to people; `m2m` roles to machine clients.'
        is_default:
          type: boolean
          description: True when the role is granted automatically to new users.
        scopes:
          type: array
          items: { type: string }
        created_at: { type: integer, description: Unix epoch seconds. }

    Resource:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        indicator: { type: string, description: 'Resource indicator URI (RFC 8707).' }
        scopes:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              description: { type: string }

    Connector:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [google, facebook, apple, microsoft, github, twitter, ses, hubtel] }
        name: { type: string }
        is_active: { type: boolean }
        config: { type: object, additionalProperties: true, description: 'Provider-specific configuration. Secrets are returned masked.' }

    AuditLogEntry:
      type: object
      properties:
        id: { type: string }
        event_type: { type: string, example: role.assigned }
        actor_type: { type: string, example: admin }
        actor_id: { type: [string, 'null'] }
        actor_name:
          type: [string, 'null']
          description: Resolved from `actor_id` where that record still exists.
        target_type: { type: [string, 'null'], example: user }
        target_id: { type: [string, 'null'] }
        target_name:
          type: [string, 'null']
          description: Resolved from `target_id` where that record still exists.
        client_id:
          type: [string, 'null']
          description: The `application_id` the action was taken through, when it was taken through one.
        ip_address: { type: [string, 'null'] }
        user_agent: { type: [string, 'null'] }
        metadata:
          type: [object, 'null']
          additionalProperties: true
        created_at: { type: integer }
    Application:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        logo_url: { type: [string, "null"], format: uri }
        support_email: { type: [string, "null"], format: email }
        branding:
          type: object
          additionalProperties: true
          description: 'JSON branding bag (primary_color, hosted-page copy, etc.).'
        organization_id: { type: [string, "null"] }
        is_active: { type: boolean }
        capabilities:
          type: object
          properties:
            oauth: { $ref: '#/components/schemas/ApplicationOAuthCapability' }
            rewards: { $ref: '#/components/schemas/ApplicationRewardsCapability' }
            subscriptions: { $ref: '#/components/schemas/ApplicationSubscriptionsCapability' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApplicationCreate:
      type: object
      required: [name]
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        logo_url: { type: string, format: uri }
        support_email: { type: string, format: email }
        branding: { type: object, additionalProperties: true }
        organization_id: { type: string }
        is_active: { type: boolean, default: true }

    ApplicationUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        logo_url: { type: string, format: uri }
        support_email: { type: string, format: email }
        branding: { type: object, additionalProperties: true }
        organization_id: { type: string }
        is_active: { type: boolean }

    ApplicationOAuthCapability:
      type: object
      properties:
        application_id: { type: string }
        client_id: { type: string }
        client_type: { type: string, enum: [confidential, public, spa, m2m] }
        redirect_uris:
          type: array
          items: { type: string, format: uri }
        post_logout_uris:
          type: array
          items: { type: string, format: uri }
        allowed_scopes:
          type: array
          items: { type: string }
        cors_origins:
          type: array
          items: { type: string, format: uri }
        access_token_ttl: { type: integer, description: 'Seconds.' }
        refresh_token_ttl: { type: integer, description: 'Seconds.' }
        id_token_ttl: { type: integer, description: 'Seconds.' }
        refresh_token_rotation: { type: boolean }
        auth_methods:
          type: array
          items: { type: string, enum: [client_secret_basic, client_secret_post, none, private_key_jwt] }
        access_control: { type: object, additionalProperties: true }
        custom_subdomain: { type: [string, "null"] }
        custom_domain: { type: [string, "null"] }

    ApplicationOAuthCapabilityCreate:
      allOf:
        - $ref: '#/components/schemas/ApplicationOAuthCapability'

    ApplicationRewardsCapability:
      type: object
      properties:
        application_id: { type: string }
        allowed_event_types:
          type: array
          items: { type: string }
        custom_rules: { type: object, additionalProperties: true }
        points_multiplier: { type: number, default: 1.0 }
        is_active: { type: boolean }

    ApplicationRewardsCapabilityCreate:
      allOf:
        - $ref: '#/components/schemas/ApplicationRewardsCapability'

    ApplicationSubscriptionsCapability:
      type: object
      properties:
        application_id: { type: string }
        billing_email: { type: [string, "null"], format: email }
        entitlement_jwt_mode: { type: string, enum: [off, on_with_access_token, on_with_dedicated_jwt] }
        notification_config: { type: object, additionalProperties: true }
        allowed_widget_origins:
          type: array
          items: { type: string, format: uri }
          description: 'Origins whitelisted to load the embedded checkout widget.'
        is_active: { type: boolean }

    ApplicationSubscriptionsCapabilityCreate:
      allOf:
        - $ref: '#/components/schemas/ApplicationSubscriptionsCapability'

    Plan:
      type: object
      properties:
        id: { type: string }
        application_id: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        amount: { type: integer, description: 'Price in minor units (pesewas for GHS, cents for USD).' }
        currency: { type: string, enum: [GHS, USD] }
        interval: { type: string, enum: [day, week, month, quarter, annual] }
        interval_count: { type: integer, default: 1 }
        trial_period_days: { type: [integer, "null"] }
        max_seats: { type: integer, default: 1 }
        is_active: { type: boolean }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PlanCreate:
      type: object
      required: [application_id, name, amount, currency, interval]
      properties:
        application_id: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        amount: { type: integer }
        currency: { type: string, enum: [GHS, USD] }
        interval: { type: string, enum: [day, week, month, quarter, annual] }
        interval_count: { type: integer, default: 1 }
        trial_period_days: { type: integer }
        max_seats: { type: integer, default: 1 }
        is_active: { type: boolean, default: true }
        metadata: { type: object, additionalProperties: true }

    PlanUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        amount: { type: integer }
        currency: { type: string, enum: [GHS, USD] }
        trial_period_days: { type: integer }
        max_seats: { type: integer }
        is_active: { type: boolean }
        metadata: { type: object, additionalProperties: true }

    SubscriptionState:
      type: string
      enum: [trialing, active, past_due, unpaid, cancelled, expired, paused]

    Subscription:
      type: object
      properties:
        id: { type: string }
        application_id: { type: string }
        user_id: { type: string }
        plan_id: { type: string }
        state: { $ref: '#/components/schemas/SubscriptionState' }
        currency: { type: string, enum: [GHS, USD] }
        current_period_start: { type: string, format: date-time }
        current_period_end: { type: string, format: date-time }
        trial_start: { type: [string, "null"], format: date-time }
        trial_end: { type: [string, "null"], format: date-time }
        cancel_at_period_end: { type: boolean }
        cancelled_at: { type: [string, "null"], format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        is_sponsored: { type: boolean }
        sponsored_reason: { type: [string, "null"] }
        payment_provider: { type: [string, "null"], enum: [paystack, hubtel, sponsored] }
        seat_count: { type: integer }
        seats:
          type: array
          items: { $ref: '#/components/schemas/Seat' }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SubscriptionCreate:
      type: object
      required: [user_id, plan_id]
      properties:
        user_id: { type: string }
        plan_id: { type: string }
        trial_period_days: { type: [integer, "null"] }
        promo_code: { type: string }
        payment_method_token: { type: string, description: 'Paystack reusable authorization code.' }
        metadata: { type: object, additionalProperties: true }
        idempotency_key: { type: string }

    CheckoutMode:
      type: string
      enum: [hosted, embedded]

    CheckoutSession:
      type: object
      description: |
        Shape returned by `GET /v1/checkout/:sessionId`. Note that timestamps are
        unix seconds (integers), not ISO strings, and `subscription_id` /
        `completed_at` are populated atomically when the session completes
        (migration 0042).
      properties:
        session_id: { type: string, description: 'The session id, e.g. cos_3a9b…' }
        application_id: { type: string }
        plan_id: { type: string }
        user_id: { type: [string, "null"] }
        status: { type: string, enum: [pending, completed, expired] }
        mode: { $ref: '#/components/schemas/CheckoutMode' }
        promo_code_id: { type: [string, "null"] }
        payment_provider: { type: [string, "null"], enum: [paystack, hubtel, null] }
        subscription_id: { type: [string, "null"], description: 'The resulting subscription id once status=completed; null while pending/expired.' }
        expires_at: { type: integer, description: 'Unix seconds; sessions auto-expire 30 minutes after creation.' }
        created_at: { type: integer, description: 'Unix seconds.' }
        completed_at: { type: [integer, "null"], description: 'Unix seconds; null while pending/expired.' }
        success_url: { type: string, format: uri }
        cancel_url: { type: [string, "null"], format: uri }
        metadata: { type: [object, "null"], description: 'Tenant-supplied metadata object from creation time.' }

    CheckoutCreateResponse:
      type: object
      description: Shape returned by `POST /v1/checkout`.
      required: [session_id, checkout_url, expires_at]
      properties:
        session_id: { type: string }
        checkout_url: { type: string, format: uri, description: 'Always the hosted URL; for embedded the same id is passed to mgpass.checkout.open().' }
        embed_session_id: { type: string, description: 'Returned only when mode=embedded; equal to session_id, surfaced separately for clarity.' }
        mode: { $ref: '#/components/schemas/CheckoutMode' }
        expires_at: { type: integer, description: 'Unix seconds.' }

    CheckoutCreate:
      type: object
      required: [plan_id]
      properties:
        plan_id: { type: string }
        user_id: { type: string }
        email: { type: string, format: email }
        mode: { $ref: '#/components/schemas/CheckoutMode' }
        payment_provider: { type: string, enum: [paystack, hubtel] }
        promo_code: { type: string }
        success_url: { type: string, format: uri }
        cancel_url: { type: string, format: uri }
        metadata: { type: object, additionalProperties: true }

    Invoice:
      type: object
      properties:
        id: { type: string }
        subscription_id: { type: string }
        application_id: { type: string }
        user_id: { type: string }
        number: { type: string }
        status: { type: string, enum: [draft, open, paid, void, uncollectible] }
        amount_due: { type: integer }
        amount_paid: { type: integer }
        amount_refunded: { type: integer }
        currency: { type: string, enum: [GHS, USD] }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        line_items:
          type: array
          items:
            type: object
            properties:
              description: { type: string }
              amount: { type: integer }
              currency: { type: string, enum: [GHS, USD] }
              proration: { type: boolean }
        paid_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    Payment:
      type: object
      properties:
        id: { type: string }
        subscription_id: { type: string }
        invoice_id: { type: [string, "null"] }
        provider: { type: string, enum: [paystack, hubtel, sponsored] }
        provider_reference: { type: string }
        amount: { type: integer }
        currency: { type: string, enum: [GHS, USD] }
        status: { type: string, enum: [pending, succeeded, failed, refunded, partially_refunded] }
        failure_reason: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    PromoCode:
      type: object
      properties:
        id: { type: string }
        application_id: { type: string }
        code: { type: string }
        discount_type: { type: string, enum: [percent, amount, trial_extension] }
        discount_value: { type: integer, description: 'Percent (1-100) or amount in minor units, or extra trial days.' }
        currency: { type: [string, "null"], enum: [GHS, USD] }
        max_redemptions: { type: [integer, "null"] }
        redemption_count: { type: integer }
        per_user_limit: { type: integer, default: 1 }
        applies_to_plan_ids:
          type: array
          items: { type: string }
        starts_at: { type: [string, "null"], format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        is_active: { type: boolean }

    PromoCodeCreate:
      type: object
      required: [code, discount_type, discount_value]
      properties:
        code: { type: string }
        application_id: { type: string }
        discount_type: { type: string, enum: [percent, amount, trial_extension] }
        discount_value: { type: integer }
        currency: { type: string, enum: [GHS, USD] }
        max_redemptions: { type: integer }
        per_user_limit: { type: integer, default: 1 }
        applies_to_plan_ids:
          type: array
          items: { type: string }
        starts_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        is_active: { type: boolean, default: true }

    Seat:
      type: object
      properties:
        id: { type: string }
        subscription_id: { type: string }
        email: { type: string, format: email }
        name: { type: [string, "null"] }
        user_id: { type: [string, "null"] }
        status: { type: string, enum: [invited, active, removed] }
        invite_token: { type: [string, "null"], description: 'Returned only on invite creation.' }
        invited_at: { type: string, format: date-time }
        accepted_at: { type: [string, "null"], format: date-time }

    NotificationCategory:
      type: string
      enum: [account, security, subscription, billing, rewards, system, marketing]

    NotificationPriority:
      type: string
      enum: [low, normal, high, critical]

    NotificationDelivery:
      type: object
      properties:
        surface: { type: string, enum: [in_app, email, sms] }
        status: { type: string, enum: [queued, sent, delivered, failed, suppressed] }
        delivered_at: { type: [string, "null"], format: date-time }
        failure_reason: { type: [string, "null"] }

    Notification:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        application_id: { type: [string, "null"] }
        event_type: { type: string }
        category: { $ref: '#/components/schemas/NotificationCategory' }
        priority: { $ref: '#/components/schemas/NotificationPriority' }
        title: { type: string }
        body: { type: string }
        action_url: { type: [string, "null"], format: uri }
        metadata: { type: object, additionalProperties: true }
        read: { type: boolean }
        read_at: { type: [string, "null"], format: date-time }
        deliveries:
          type: array
          items: { $ref: '#/components/schemas/NotificationDelivery' }
        created_at: { type: string, format: date-time }

    NotificationPreference:
      type: object
      properties:
        event_type: { type: string }
        category: { $ref: '#/components/schemas/NotificationCategory' }
        surfaces:
          type: object
          properties:
            in_app: { type: boolean }
            email: { type: boolean }
            sms: { type: boolean }

    NotificationTemplate:
      type: object
      properties:
        id: { type: string }
        event_type: { type: string }
        channel: { type: string, enum: [email, sms, in_app] }
        locale: { type: string, default: en }
        subject: { type: [string, "null"], description: 'Email only.' }
        body: { type: string }
        is_active: { type: boolean }

    Webhook:
      type: object
      properties:
        id: { type: string }
        application_id: { type: string }
        url: { type: string, format: uri }
        description: { type: [string, "null"] }
        event_types:
          type: array
          items: { type: string }
          description: 'Canonical event types this endpoint subscribes to. See WebhookEvent.'
        is_active: { type: boolean }
        last_delivery_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    WebhookCreate:
      type: object
      required: [url, event_types]
      properties:
        url: { type: string, format: uri }
        description: { type: string }
        event_types:
          type: array
          items: { type: string }
        is_active: { type: boolean, default: true }

    WebhookDelivery:
      type: object
      properties:
        id: { type: string }
        webhook_id: { type: string }
        event_id: { type: string }
        event_type: { type: string }
        request_body: { type: string }
        response_status: { type: [integer, "null"] }
        response_body: { type: [string, "null"] }
        attempt: { type: integer }
        succeeded: { type: boolean }
        next_retry_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    WebhookEventEnvelope:
      type: object
      description: |
        Canonical envelope for every webhook event. The body shape varies by `type`; see
        `WebhookEvent` for the discriminated union of typed payloads. Verify the request with
        the HMAC-SHA256 `X-MGPass-Signature` header using your webhook's raw `webhook_secret`.
      required: [id, type, created_at, application_id, data]
      properties:
        id: { type: string }
        type: { type: string }
        created_at: { type: string, format: date-time }
        application_id: { type: string }
        livemode: { type: boolean }
        data: { type: object, additionalProperties: true }

    WebhookEvent:
      oneOf:
        - $ref: '#/components/schemas/EventSubscriptionCreated'
        - $ref: '#/components/schemas/EventSubscriptionActivated'
        - $ref: '#/components/schemas/EventSubscriptionRenewed'
        - $ref: '#/components/schemas/EventSubscriptionPaymentFailed'
        - $ref: '#/components/schemas/EventSubscriptionUnpaid'
        - $ref: '#/components/schemas/EventSubscriptionCancelled'
        - $ref: '#/components/schemas/EventSubscriptionExpired'
        - $ref: '#/components/schemas/EventSubscriptionTrialEnding'
        - $ref: '#/components/schemas/EventSubscriptionPlanChanged'
        - $ref: '#/components/schemas/EventApplicationCreated'
        - $ref: '#/components/schemas/EventApplicationUpdated'
        - $ref: '#/components/schemas/EventApplicationDeleted'
        - $ref: '#/components/schemas/EventApplicationOauthEnabled'
        - $ref: '#/components/schemas/EventApplicationOauthDisabled'
        - $ref: '#/components/schemas/EventApplicationRewardsEnabled'
        - $ref: '#/components/schemas/EventApplicationRewardsDisabled'
        - $ref: '#/components/schemas/EventApplicationSubscriptionsEnabled'
        - $ref: '#/components/schemas/EventApplicationSubscriptionsDisabled'
      discriminator:
        propertyName: type

    EventSubscriptionCreated:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          properties:
            type: { type: string, const: subscription.created }
            data:
              type: object
              properties:
                subscription: { $ref: '#/components/schemas/Subscription' }
                amount: { type: integer }
                currency: { type: string, enum: [GHS, USD] }

    EventSubscriptionActivated:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          properties:
            type: { type: string, const: subscription.activated }
            data:
              type: object
              properties:
                subscription: { $ref: '#/components/schemas/Subscription' }
                amount: { type: integer }
                currency: { type: string, enum: [GHS, USD] }

    EventSubscriptionRenewed:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          properties:
            type: { type: string, const: subscription.renewed }
            data:
              type: object
              properties:
                subscription: { $ref: '#/components/schemas/Subscription' }
                invoice: { $ref: '#/components/schemas/Invoice' }
                amount: { type: integer }
                currency: { type: string, enum: [GHS, USD] }

    EventSubscriptionPaymentFailed:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          properties:
            type: { type: string, const: subscription.payment_failed }
            data:
              type: object
              properties:
                subscription: { $ref: '#/components/schemas/Subscription' }
                payment: { $ref: '#/components/schemas/OneOffPayment' }
                amount: { type: integer }
                currency: { type: string, enum: [GHS, USD] }
                attempt: { type: integer }

    EventSubscriptionUnpaid:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          properties:
            type: { type: string, const: subscription.unpaid }
            data:
              type: object
              properties:
                subscription: { $ref: '#/components/schemas/Subscription' }
                amount: { type: integer }
                currency: { type: string, enum: [GHS, USD] }

    EventSubscriptionCancelled:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          properties:
            type: { type: string, const: subscription.cancelled }
            data:
              type: object
              properties:
                subscription: { $ref: '#/components/schemas/Subscription' }
                cancelled_by: { type: string, enum: [user, admin, system] }

    EventSubscriptionExpired:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          properties:
            type: { type: string, const: subscription.expired }
            data:
              type: object
              properties:
                subscription: { $ref: '#/components/schemas/Subscription' }

    EventSubscriptionTrialEnding:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          properties:
            type: { type: string, const: subscription.trial_ending }
            data:
              type: object
              properties:
                subscription: { $ref: '#/components/schemas/Subscription' }
                trial_end: { type: string, format: date-time }

    EventSubscriptionPlanChanged:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          properties:
            type: { type: string, const: subscription.plan_changed }
            data:
              type: object
              properties:
                subscription: { $ref: '#/components/schemas/Subscription' }
                previous_plan_id: { type: string }
                new_plan_id: { type: string }
                proration: { $ref: '#/components/schemas/ProrationPreview' }

    EventApplicationCreated:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          properties:
            type: { type: string, const: application.created }
            data:
              type: object
              properties:
                application: { $ref: '#/components/schemas/Application' }

    EventApplicationUpdated:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          properties:
            type: { type: string, const: application.updated }
            data:
              type: object
              properties:
                application: { $ref: '#/components/schemas/Application' }

    EventApplicationDeleted:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          properties:
            type: { type: string, const: application.deleted }
            data:
              type: object
              properties:
                application_id: { type: string }

    EventApplicationOauthEnabled:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          properties:
            type: { type: string, const: application.oauth.enabled }
            data:
              type: object
              properties:
                application_id: { type: string }
                capability: { $ref: '#/components/schemas/ApplicationOAuthCapability' }

    EventApplicationOauthDisabled:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          properties:
            type: { type: string, const: application.oauth.disabled }
            data:
              type: object
              properties:
                application_id: { type: string }

    EventApplicationRewardsEnabled:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          properties:
            type: { type: string, const: application.rewards.enabled }
            data:
              type: object
              properties:
                application_id: { type: string }
                capability: { $ref: '#/components/schemas/ApplicationRewardsCapability' }

    EventApplicationRewardsDisabled:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          properties:
            type: { type: string, const: application.rewards.disabled }
            data:
              type: object
              properties:
                application_id: { type: string }

    EventApplicationSubscriptionsEnabled:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          properties:
            type: { type: string, const: application.subscriptions.enabled }
            data:
              type: object
              properties:
                application_id: { type: string }
                capability: { $ref: '#/components/schemas/ApplicationSubscriptionsCapability' }

    EventApplicationSubscriptionsDisabled:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          properties:
            type: { type: string, const: application.subscriptions.disabled }
            data:
              type: object
              properties:
                application_id: { type: string }

    ProrationPreview:
      type: object
      properties:
        credit: { type: integer, description: 'Credit applied for unused time on the old plan, in minor units.' }
        charge_amount: { type: integer, description: 'Net amount to charge, in minor units.' }
        currency: { type: string, enum: [GHS, USD] }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        breakdown:
          type: array
          items:
            type: object
            properties:
              description: { type: string }
              amount: { type: integer }
              type: { type: string, enum: [credit, charge] }

    StatsRevenue:
      type: object
      properties:
        currency: { type: string, enum: [GHS, USD] }
        daily_revenue:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              amount: { type: integer, description: 'In minor units.' }
        top_plans:
          type: array
          items:
            type: object
            properties:
              plan_id: { type: string }
              plan_name: { type: string }
              mrr: { type: integer }
              subscriber_count: { type: integer }
        churn_rate_30d: { type: number, description: 'Fraction in [0,1].' }
        arpu_30d: { type: integer, description: 'Average revenue per user (minor units).' }
        refund_volume_30d: { type: integer, description: 'Refunds in minor units (30 days).' }
        active_subscriptions: { type: integer }
        trialing_subscriptions: { type: integer }

    RewardsSummary:
      type: object
      properties:
        total_points: { type: integer, description: Points available to spend now. }
        lifetime_earned:
          type: integer
          description: Points earned over the account's life. Tier is calculated from this, not from the spendable balance.
        tier: { type: string, enum: [bronze, silver, gold, platinum] }
        tier_details:
          type: [object, 'null']
          description: The tier's own configuration, or null when the tier has none.
          additionalProperties: true
        next_tier:
          type: [object, 'null']
          description: The tier above, and the gap to it. Null at the top tier.
          properties:
            points_needed:
              type: integer
              description: '`min_points` of the next tier minus `lifetime_earned`.'
          additionalProperties: true
        redemption:
          type: [object, 'null']
          description: What the balance is worth against a purchase, at this tier. Null when the tier has no active configuration.
          properties:
            rate: { type: number, description: Cedis one point is worth. }
            min_points: { type: integer, description: Smallest redemption this tier permits. }
            value: { type: number, description: The whole balance in cedis, rounded down to the pesewa. }
            currency: { type: string, enum: [GHS] }

    PointsLedgerEntry:
      type: object
      description: One movement of points. The ledger is append-only and is the source of truth for a balance.
      properties:
        id: { type: string, example: pts_01HXR3M4K2 }
        user_id: { type: string, example: usr_abc123 }
        event_type:
          type: string
          description: What caused the movement, e.g. `purchase`, `cashback_redeem`, `cashback_refund`.
          example: purchase
        platform:
          type: [string, 'null']
          description: The Application the movement came from, by name.
          example: 3news
        points:
          type: integer
          description: Signed. Positive credits the user, negative debits them.
          example: 150
        rule_version: { type: [string, 'null'] }
        reference_id:
          type: [string, 'null']
          description: The caller's own reference for the originating event, when one was sent.
        metadata:
          type: [object, 'null']
          additionalProperties: true
        created_at: { type: integer }
        name:
          type: [string, 'null']
          description: The holder's name, joined in by the admin ledger search.
        email:
          type: [string, 'null']
          description: The holder's email, joined in by the admin ledger search.
    Redemption:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        redemption_type:
          type: string
          enum: [catalog, cashback, partner_order]
          description: Which fields below carry values depends on this.
        reward_id:
          type: [string, 'null']
          description: The catalog item. Set on `catalog` redemptions only.
        points_cost: { type: integer, description: Points taken from the balance. }
        status: { type: string, enum: [pending, processing, completed, failed, cancelled] }
        tier_at_redemption:
          type: [string, 'null']
          description: The tier whose rate applied, recorded so a later tier change cannot rewrite history.
        cashback_amount: { type: [number, 'null'], description: Cedis paid out. `cashback` only. }
        phone_number: { type: [string, 'null'], description: Mobile money number. `cashback` only. }
        network: { type: [string, 'null'], description: Mobile money network. `cashback` only. }
        fee_amount: { type: [number, 'null'], description: Processing fee in cedis. `cashback` only. }
        application_id: { type: [string, 'null'], description: '`partner_order` only.' }
        order_reference: { type: [string, 'null'], description: '`partner_order` only.' }
        order_amount: { type: [number, 'null'], description: '`partner_order` only.' }
        value_amount: { type: [number, 'null'], description: The discount granted. `partner_order` only. }
        currency: { type: [string, 'null'], enum: [GHS, null] }
        created_at: { type: integer, description: Unix epoch seconds. }
        updated_at: { type: integer, description: Unix epoch seconds. }
        committed_at: { type: [integer, 'null'] }
        voided_at: { type: [integer, 'null'] }
        expires_at: { type: [integer, 'null'], description: When an unsettled hold lapses. `partner_order` only. }

    RewardsRule:
      type: object
      properties:
        id: { type: string }
        platform:
          type: [string, 'null']
          description: The Application the rule applies to, by name. Null matches every Application.
        event_type: { type: string, example: purchase }
        tier:
          type: [string, 'null']
          description: Restrict the rule to one tier. Null applies it to all.
        points: { type: integer, description: Points awarded, or points per unit when `points_type` is `per_unit`. }
        points_type: { type: string, enum: [flat, per_unit] }
        unit_field:
          type: [string, 'null']
          description: The metadata field multiplied by `points` when `points_type` is `per_unit`, e.g. `amount`.
        daily_cap: { type: [integer, 'null'] }
        monthly_cap: { type: [integer, 'null'] }
        is_active: { type: integer, description: '`1` when the rule is evaluated.' }
        version: { type: [string, 'null'], description: Stamped onto every ledger entry the rule produces. }
        created_at: { type: integer, description: Unix epoch seconds. }

    CatalogItem:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        image_url: { type: [string, "null"], format: uri }
        points_cost: { type: integer }
        stock: { type: [integer, "null"], description: 'Null means unlimited.' }
        required_tier: { type: [string, "null"] }
        is_active: { type: boolean }

    Benefit:
      type: object
      properties:
        id: { type: string }
        tier: { type: string }
        title: { type: string }
        description: { type: string }
        icon: { type: [string, "null"] }
        is_active: { type: boolean }

    CashbackConfig:
      type: object
      properties:
        id: { type: string }
        application_id: { type: string }
        is_enabled: { type: boolean }
        points_per_unit: { type: integer, description: 'Points required for 1 minor unit of cashback.' }
        min_redemption: { type: integer, description: 'Minimum cashback redemption in minor units.' }
        currency: { type: string, enum: [GHS] }
        allowed_networks:
          type: array
          items: { type: string, enum: [MTN, VODAFONE, AIRTELTIGO] }

    OrderRedemptionQuote:
      type: object
      properties:
        tier: { type: string, example: gold }
        rate:
          type: number
          description: Ghana cedis one point is worth, for this user's tier.
          example: 0.008
        balance: { type: integer, example: 5000 }
        min_points:
          type: integer
          description: Smallest redemption this tier permits.
          example: 100
        max_order_fraction:
          type: number
          description: Largest share of the order points may cover.
          example: 1.0
        max_points:
          type: integer
          description: The smaller of what the user holds and what the order can absorb.
          example: 5000
        max_value: { type: number, example: 40.0 }
        points:
          type: integer
          description: The points asked about, clamped to what is spendable.
          example: 5000
        value:
          type: number
          description: What `points` is worth — the discount the order would receive.
          example: 40.0
        eligible: { type: boolean, example: true }
        reason:
          type: string
          description: Why nothing can be spent, when `eligible` is false.
          enum: [no_config, no_balance, below_minimum, order_too_small]

    OrderRedemption:
      type: object
      properties:
        redemption_id: { type: string, example: rdm_xyz789 }
        status:
          type: string
          enum: [pending, processing, completed, cancelled, failed]
        user_id: { type: string, example: usr_abc123def456 }
        order_reference: { type: string, example: acme-ORD-4821 }
        order_amount: { type: number, example: 500.0 }
        points_spent: { type: integer, example: 5000 }
        value:
          type: number
          description: Subtract this from `order_amount` when you charge.
          example: 40.0
        currency: { type: string, example: GHS }
        tier_at_redemption: { type: string, example: gold }
        created_at: { type: integer, example: 1789714852 }
        committed_at: { type: [integer, 'null'] }
        voided_at: { type: [integer, 'null'] }
        expires_at:
          type: [integer, 'null']
          description: >
            When the hold lapses and the platform returns the points. A
            reservation is a hold, not a plain debit.
        replayed:
          type: boolean
          description: >
            True when this reservation already existed for `order_reference`
            and the original was returned instead of a second debit.
        already:
          type: boolean
          description: True when the call repeated a settlement already made.

    ApiResource:
      type: object
      description: An audience access tokens can be issued for, with its own scopes and token lifetime.
      properties:
        id: { type: string, example: res_orders }
        name: { type: string, example: Orders API }
        identifier:
          type: string
          description: The audience value tokens carry. Conventionally a URI.
          example: https://api.acme.com
        token_ttl:
          type: integer
          description: Access-token lifetime in seconds for this audience.
          example: 3600
        is_active: { type: integer, description: '`1` when active.', example: 1 }

    ApiScope:
      type: object
      properties:
        id: { type: string, example: scp_orders_read }
        api_resource_id: { type: string, example: res_orders }
        name: { type: string, example: 'orders:read' }
        description: { type: [string, 'null'] }

    OneOffPayment:
      type: object
      description: A one-off charge, distinct from a subscription payment. Money is in minor units throughout.
      properties:
        payment_id: { type: string, example: pay_01HXR3M4K2 }
        reference:
          type: string
          description: Your own order id, as you sent it.
        status:
          type: string
          enum: [pending, succeeded, failed, abandoned, refunded]
          description: '`abandoned` is a charge nobody completed before it expired — a real outcome, not a stuck row.'
        amount: { type: integer, description: 'What you asked to charge, in minor units.' }
        currency: { type: string, enum: [GHS, USD] }
        channel: { type: [string, 'null'], enum: [card, mobile_money, bank, ussd, bank_transfer, null] }
        provider_reference: { type: [string, 'null'], description: 'The payment provider''s reference, for reconciliation.' }
        customer_email: { type: string, format: email }
        customer_phone: { type: [string, 'null'] }
        user_id: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        settled_amount:
          type: [integer, 'null']
          description: What reached the subaccount, when a split applied.
        platform_fee:
          type: [integer, 'null']
          description: What was retained, when a split applied.
        split_subaccount: { type: [string, 'null'] }
        failure_reason: { type: [string, 'null'] }
        created_at: { type: integer, description: Unix epoch seconds. }
        paid_at: { type: [integer, 'null'] }
        failed_at: { type: [integer, 'null'] }
        expires_at:
          type: [integer, 'null']
          description: When a still-pending charge is swept to `abandoned`.
        replayed:
          type: boolean
          description: True when this `reference` already had a payment and the original was returned.
        authorization_url:
          type: [string, 'null']
          description: Where to send the payer. Present on hosted channels only.
        display_text:
          type: [string, 'null']
          description: What to tell the buyer about the prompt on their phone. Mobile money only.

    PayoutDestination:
      type: object
      description: A place money settles to. Not a person, a vendor or an organiser — those are the caller's concepts.
      properties:
        destination_id: { type: string, example: pyd_01HXR3M4K2 }
        reference: { type: string, description: Your own id for the payee. }
        subaccount:
          type: string
          description: Pass this as `subaccount` on a payment to split it here.
          example: ACCT_organizer123
        business_name: { type: string }
        destination_type: { type: string, enum: [bank, mobile_money] }
        settlement_bank: { type: string, description: The bank or wallet code money settles to. }
        account_last4:
          type: [string, 'null']
          description: The last four digits. The full number is held by the payment provider, not here.
        account_name:
          type: [string, 'null']
          description: The name the bank has on file, as resolved by the provider. Worth showing the payee.
        currency: { type: string, enum: [GHS, USD] }
        subaccount_percentage:
          type: number
          description: Percentage of each payment this payee receives. A flat `platform_fee` on a payment takes precedence over it.
        status:
          type: string
          enum: [pending_verification, active, inactive]
          description: New destinations start `pending_verification` — the provider holds first payouts until it verifies them.
        created_at: { type: integer, description: Unix epoch seconds. }
        replayed:
          type: boolean
          description: True when this `reference` already had a destination and the original was returned.
        notice:
          type: [string, 'null']
          description: Present on creation. Says that first payouts are held until verification, which the payee needs to hear before their first sale.
