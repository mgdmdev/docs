      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, plan_id]
              properties:
                user_id: { type: string }
                plan_id: { type: string }
                ends_at: { type: [string, "null"], format: date-time }
                reason: { type: string }
                idempotency_key: { type: string }
      responses:
        '201':
          description: Sponsored subscription created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }

