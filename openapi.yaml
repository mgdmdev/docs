  # ─────────────────────────────────────────────────────────────────────────────
  # SDKs
  # ─────────────────────────────────────────────────────────────────────────────
  /sdk/onetap.js:
    get:
      operationId: getOneTapSdk
      tags: [SDKs]
      security: []
      summary: One-Tap sign-in SDK bundle
      description: |
        Public JS bundle exposing `window.mgpass.onetap({ client_id, callback, login_url })`.
        On Chromium it runs the native FedCM account chooser; on Safari/Firefox (no
        FedCM) it shows a "Continue with mgPass" card that redirects to `login_url`.
      responses:
        '200':
          description: JS bundle.
          content:
            text/javascript:
              schema: { type: string }

  /sdk/checkout.js:
    get:
      operationId: getCheckoutSdk
      tags: [SDKs]
      security: []
      summary: Embeddable checkout SDK bundle
      description: |
        Public, 1-hour-cached JS bundle that exposes `window.mgpass.checkout.open(options)`.
        Use `GET /sdk/checkout.js.sri` to pin an SRI hash for `<script integrity>`.
      responses:
        '200':
          description: JS bundle.
          content:
            text/javascript:
              schema: { type: string }

  /sdk/checkout.js.sri:
    get:
      operationId: getCheckoutSdkSri
      tags: [SDKs]
      security: []
      summary: Checkout SDK SRI hash
      responses:
        '200':
          description: SRI metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  integrity: { type: string, description: 'e.g. "sha384-..."' }
                  bundle_version: { type: string }

components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Admin user access token with the `mgpass:admin` scope.
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth access token issued to an end user.
    tenantApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Tenant API key for v1 endpoints and rewards partner ingestion.
    basicClient:
      type: http
      scheme: basic
      description: 'HTTP Basic — confidential OAuth client (client_id : client_secret).'

  responses:
    Error:
      description: Standard error envelope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: 'invalid_request' }
            message: { type: string, example: 'plan_id is required.' }
            details: { type: object, additionalProperties: true }

    TokenResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer }
        refresh_token: { type: string }
        id_token: { type: string }
        scope: { type: string }

    UserProfile:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        email_verified: { type: boolean }
        phone: { type: [string, "null"] }
        phone_verified: { type: boolean }
        name: { type: [string, "null"] }
        given_name: { type: [string, "null"] }
        family_name: { type: [string, "null"] }
        picture: { type: [string, "null"], format: uri }
        locale: { type: [string, "null"] }
        mfa_enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UserProfileUpdate:
      type: object
      properties:
        name: { type: string }
        given_name: { type: string }
        family_name: { type: string }
        phone: { type: string }
        locale: { type: string }
        picture: { type: string, format: uri }

    Session:
      type: object
      properties:
        id: { type: string }
        user_agent: { type: string }
        ip: { type: string }
        location: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        last_active_at: { type: string, format: date-time }
        is_current: { type: boolean }

    Identity:
      type: object
      properties:
        provider: { type: string, example: google }
        provider_user_id: { type: string }
        email: { type: [string, "null"], format: email }
        linked_at: { type: string, format: date-time }

    ConnectedApp:
      type: object
      properties:
        client_id: { type: string }
        application_id: { type: string }
        name: { type: string }
        logo_url: { type: [string, "null"], format: uri }
        scopes:
          type: array
          items: { type: string }
        first_authorized_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }

    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        email_verified: { type: boolean }
        phone: { type: [string, "null"] }
        name: { type: [string, "null"] }
        organization_id: { type: [string, "null"] }
        is_suspended: { type: boolean }
        is_admin: { type: boolean }
        roles:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UserCreate:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        name: { type: string }
        phone: { type: string }
        organization_id: { type: string }
        password: { type: string, description: 'Optional — if omitted, user receives an invite email.' }
        is_admin: { type: boolean, default: false }
        roles:
          type: array
          items: { type: string }

    Organization:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        logo_url: { type: [string, "null"], format: uri }
        created_at: { type: string, format: date-time }

    Role:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        scopes:
          type: array
          items: { type: string }
        is_built_in: { type: boolean }

    Resource:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        indicator: { type: string, description: 'Resource indicator URI (RFC 8707).' }
        scopes:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              description: { type: string }

    Connector:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [google, facebook, apple, microsoft, github, twitter, ses, hubtel] }
        name: { type: string }
        is_active: { type: boolean }
        config: { type: object, additionalProperties: true, description: 'Provider-specific configuration. Secrets are returned masked.' }

    AuditLogEntry:
      type: object
      properties:
        id: { type: string }
        event_type: { type: string, description: 'snake_case `{entity}.{sub_entity?}.{action}`.' }
        actor_id: { type: [string, "null"] }
        actor_type: { type: string, enum: [admin, user, system, tenant] }
        target_type: { type: [string, "null"] }
        target_id: { type: [string, "null"] }
        application_id: { type: [string, "null"] }
        ip: { type: [string, "null"] }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }

    Application:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        logo_url: { type: [string, "null"], format: uri }
        support_email: { type: [string, "null"], format: email }
        branding:
          type: object
          additionalProperties: true
          description: 'JSON branding bag (primary_color, hosted-page copy, etc.).'
        organization_id: { type: [string, "null"] }
        is_active: { type: boolean }
        capabilities:
          type: object
          properties:
            oauth: { $ref: '#/components/schemas/ApplicationOAuthCapability' }
            rewards: { $ref: '#/components/schemas/ApplicationRewardsCapability' }
            subscriptions: { $ref: '#/components/schemas/ApplicationSubscriptionsCapability' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ApplicationCreate:
      type: object
      required: [name]
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        logo_url: { type: string, format: uri }
        support_email: { type: string, format: email }
        branding: { type: object, additionalProperties: true }
        organization_id: { type: string }
        is_active: { type: boolean, default: true }

    ApplicationUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        logo_url: { type: string, format: uri }
        support_email: { type: string, format: email }
        branding: { type: object, additionalProperties: true }
        organization_id: { type: string }
        is_active: { type: boolean }

    ApplicationOAuthCapability:
      type: object
      properties:
        application_id: { type: string }
        client_id: { type: string }
        client_type: { type: string, enum: [confidential, public, spa, m2m] }
        redirect_uris:
          type: array
          items: { type: string, format: uri }
        post_logout_uris:
          type: array
          items: { type: string, format: uri }
        allowed_scopes:
          type: array
          items: { type: string }
        cors_origins:
          type: array
          items: { type: string, format: uri }
        access_token_ttl: { type: integer, description: 'Seconds.' }
        refresh_token_ttl: { type: integer, description: 'Seconds.' }
        id_token_ttl: { type: integer, description: 'Seconds.' }
        refresh_token_rotation: { type: boolean }
        auth_methods:
          type: array
          items: { type: string, enum: [client_secret_basic, client_secret_post, none, private_key_jwt] }
        access_control: { type: object, additionalProperties: true }
        custom_subdomain: { type: [string, "null"] }
        custom_domain: { type: [string, "null"] }

    ApplicationOAuthCapabilityCreate:
      allOf:
        - $ref: '#/components/schemas/ApplicationOAuthCapability'

    ApplicationRewardsCapability:
      type: object
      properties:
        application_id: { type: string }
        allowed_event_types:
          type: array
          items: { type: string }
        custom_rules: { type: object, additionalProperties: true }
        points_multiplier: { type: number, default: 1.0 }
        is_active: { type: boolean }

    ApplicationRewardsCapabilityCreate:
      allOf:
        - $ref: '#/components/schemas/ApplicationRewardsCapability'

    ApplicationSubscriptionsCapability:
      type: object
      properties:
        application_id: { type: string }
        billing_email: { type: [string, "null"], format: email }
        entitlement_jwt_mode: { type: string, enum: [off, on_with_access_token, on_with_dedicated_jwt] }
        notification_config: { type: object, additionalProperties: true }
        allowed_widget_origins:
          type: array
          items: { type: string, format: uri }
          description: 'Origins whitelisted to load the embedded checkout widget.'
        is_active: { type: boolean }

    ApplicationSubscriptionsCapabilityCreate:
      allOf:
        - $ref: '#/components/schemas/ApplicationSubscriptionsCapability'

    Plan:
      type: object
      properties:
        id: { type: string }
        application_id: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        amount: { type: integer, description: 'Price in minor units (pesewas for GHS, cents for USD).' }
        currency: { type: string, enum: [GHS, USD] }
        interval: { type: string, enum: [day, week, month, quarter, annual] }
        interval_count: { type: integer, default: 1 }
        trial_period_days: { type: [integer, "null"] }
        max_seats: { type: integer, default: 1 }
        is_active: { type: boolean }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PlanCreate:
      type: object
      required: [application_id, name, amount, currency, interval]
      properties:
        application_id: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        amount: { type: integer }
        currency: { type: string, enum: [GHS, USD] }
        interval: { type: string, enum: [day, week, month, quarter, annual] }
        interval_count: { type: integer, default: 1 }
        trial_period_days: { type: integer }
        max_seats: { type: integer, default: 1 }
        is_active: { type: boolean, default: true }
        metadata: { type: object, additionalProperties: true }

    PlanUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        amount: { type: integer }
        currency: { type: string, enum: [GHS, USD] }
        trial_period_days: { type: integer }
        max_seats: { type: integer }
        is_active: { type: boolean }
        metadata: { type: object, additionalProperties: true }

    SubscriptionState:
      type: string
      enum: [trialing, active, past_due, unpaid, cancelled, expired, paused]

    Subscription:
      type: object
      properties:
        id: { type: string }
        application_id: { type: string }
        user_id: { type: string }
        plan_id: { type: string }
        state: { $ref: '#/components/schemas/SubscriptionState' }
        currency: { type: string, enum: [GHS, USD] }
        current_period_start: { type: string, format: date-time }
        current_period_end: { type: string, format: date-time }
        trial_start: { type: [string, "null"], format: date-time }
        trial_end: { type: [string, "null"], format: date-time }
        cancel_at_period_end: { type: boolean }
        cancelled_at: { type: [string, "null"], format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        is_sponsored: { type: boolean }
        sponsored_reason: { type: [string, "null"] }
        payment_provider: { type: [string, "null"], enum: [paystack, hubtel, sponsored] }
        seat_count: { type: integer }
        seats:
          type: array
          items: { $ref: '#/components/schemas/Seat' }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SubscriptionCreate:
      type: object
      required: [user_id, plan_id]
      properties:
        user_id: { type: string }
        plan_id: { type: string }
        trial_period_days: { type: [integer, "null"] }
        promo_code: { type: string }
        payment_method_token: { type: string, description: 'Paystack reusable authorization code.' }
        metadata: { type: object, additionalProperties: true }
        idempotency_key: { type: string }

    CheckoutMode:
      type: string
      enum: [hosted, embedded]

    CheckoutSession:
      type: object
      description: |
        Shape returned by `GET /v1/checkout/:sessionId`. Note that timestamps are
        unix seconds (integers), not ISO strings, and `subscription_id` /
        `completed_at` are populated atomically when the session completes
        (migration 0042).
      properties:
        session_id: { type: string, description: 'The session id, e.g. cos_3a9b…' }
        application_id: { type: string }
        plan_id: { type: string }
        user_id: { type: [string, "null"] }
        status: { type: string, enum: [pending, completed, expired] }
        mode: { $ref: '#/components/schemas/CheckoutMode' }
        promo_code_id: { type: [string, "null"] }
        payment_provider: { type: [string, "null"], enum: [paystack, hubtel, null] }
        subscription_id: { type: [string, "null"], description: 'The resulting subscription id once status=completed; null while pending/expired.' }
        expires_at: { type: integer, description: 'Unix seconds; sessions auto-expire 30 minutes after creation.' }
        created_at: { type: integer, description: 'Unix seconds.' }
        completed_at: { type: [integer, "null"], description: 'Unix seconds; null while pending/expired.' }
        success_url: { type: string, format: uri }
        cancel_url: { type: [string, "null"], format: uri }
        metadata: { type: [object, "null"], description: 'Tenant-supplied metadata object from creation time.' }

    CheckoutCreateResponse:
      type: object
      description: Shape returned by `POST /v1/checkout`.
      required: [session_id, checkout_url, expires_at]
      properties:
        session_id: { type: string }
        checkout_url: { type: string, format: uri, description: 'Always the hosted URL; for embedded the same id is passed to mgpass.checkout.open().' }
        embed_session_id: { type: string, description: 'Returned only when mode=embedded; equal to session_id, surfaced separately for clarity.' }
        mode: { $ref: '#/components/schemas/CheckoutMode' }
        expires_at: { type: integer, description: 'Unix seconds.' }

    CheckoutCreate:
      type: object
      required: [plan_id]
      properties:
        plan_id: { type: string }
        user_id: { type: string }
        email: { type: string, format: email }
        mode: { $ref: '#/components/schemas/CheckoutMode' }
        payment_provider: { type: string, enum: [paystack, hubtel] }
        promo_code: { type: string }
        success_url: { type: string, format: uri }
        cancel_url: { type: string, format: uri }
        metadata: { type: object, additionalProperties: true }

    Invoice:
      type: object
      properties:
        id: { type: string }
        subscription_id: { type: string }
        application_id: { type: string }
        user_id: { type: string }
        number: { type: string }
        status: { type: string, enum: [draft, open, paid, void, uncollectible] }
        amount_due: { type: integer }
        amount_paid: { type: integer }
        amount_refunded: { type: integer }
        currency: { type: string, enum: [GHS, USD] }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        line_items:
          type: array
          items:
            type: object
            properties:
              description: { type: string }
              amount: { type: integer }
              currency: { type: string, enum: [GHS, USD] }
              proration: { type: boolean }
        paid_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    Payment:
      type: object
      properties:
        id: { type: string }
        subscription_id: { type: string }
        invoice_id: { type: [string, "null"] }
        provider: { type: string, enum: [paystack, hubtel, sponsored] }
        provider_reference: { type: string }
        amount: { type: integer }
        currency: { type: string, enum: [GHS, USD] }
        status: { type: string, enum: [pending, succeeded, failed, refunded, partially_refunded] }
        failure_reason: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    PromoCode:
      type: object
      properties:
        id: { type: string }
        application_id: { type: string }
        code: { type: string }
        discount_type: { type: string, enum: [percent, amount, trial_extension] }
        discount_value: { type: integer, description: 'Percent (1-100) or amount in minor units, or extra trial days.' }
        currency: { type: [string, "null"], enum: [GHS, USD] }
        max_redemptions: { type: [integer, "null"] }
        redemption_count: { type: integer }
        per_user_limit: { type: integer, default: 1 }
        applies_to_plan_ids:
          type: array
          items: { type: string }
        starts_at: { type: [string, "null"], format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        is_active: { type: boolean }

    PromoCodeCreate:
      type: object
      required: [code, discount_type, discount_value]
      properties:
        code: { type: string }
        application_id: { type: string }
        discount_type: { type: string, enum: [percent, amount, trial_extension] }
        discount_value: { type: integer }
        currency: { type: string, enum: [GHS, USD] }
        max_redemptions: { type: integer }
        per_user_limit: { type: integer, default: 1 }
        applies_to_plan_ids:
          type: array
          items: { type: string }
        starts_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        is_active: { type: boolean, default: true }

    Seat:
      type: object
      properties:
        id: { type: string }
        subscription_id: { type: string }
        email: { type: string, format: email }
        name: { type: [string, "null"] }
        user_id: { type: [string, "null"] }
        status: { type: string, enum: [invited, active, removed] }
        invite_token: { type: [string, "null"], description: 'Returned only on invite creation.' }
        invited_at: { type: string, format: date-time }
        accepted_at: { type: [string, "null"], format: date-time }

    NotificationCategory:
      type: string
      enum: [account, security, subscription, billing, rewards, system, marketing]

    NotificationPriority:
      type: string
      enum: [low, normal, high, critical]

    NotificationDelivery:
      type: object
      properties:
        surface: { type: string, enum: [in_app, email, sms] }
        status: { type: string, enum: [queued, sent, delivered, failed, suppressed] }
        delivered_at: { type: [string, "null"], format: date-time }
        failure_reason: { type: [string, "null"] }

    Notification:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        application_id: { type: [string, "null"] }
        event_type: { type: string }
        category: { $ref: '#/components/schemas/NotificationCategory' }
        priority: { $ref: '#/components/schemas/NotificationPriority' }
        title: { type: string }
        body: { type: string }
        action_url: { type: [string, "null"], format: uri }
        metadata: { type: object, additionalProperties: true }
        read: { type: boolean }
        read_at: { type: [string, "null"], format: date-time }
        deliveries:
          type: array
          items: { $ref: '#/components/schemas/NotificationDelivery' }
        created_at: { type: string, format: date-time }

    NotificationPreference:
      type: object
      properties:
        event_type: { type: string }
        category: { $ref: '#/components/schemas/NotificationCategory' }
        surfaces:
          type: object
          properties:
            in_app: { type: boolean }
            email: { type: boolean }
            sms: { type: boolean }

    NotificationTemplate:
      type: object
      properties:
        id: { type: string }
        event_type: { type: string }
        channel: { type: string, enum: [email, sms, in_app] }
        locale: { type: string, default: en }
        subject: { type: [string, "null"], description: 'Email only.' }
        body: { type: string }
        is_active: { type: boolean }

    Webhook:
      type: object
      properties:
        id: { type: string }
        application_id: { type: string }
        url: { type: string, format: uri }
        description: { type: [string, "null"] }
        event_types:
          type: array
          items: { type: string }
          description: 'Canonical event types this endpoint subscribes to. See WebhookEvent.'
        is_active: { type: boolean }
        last_delivery_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    WebhookCreate:
      type: object
      required: [url, event_types]
      properties:
        url: { type: string, format: uri }
        description: { type: string }
        event_types:
          type: array
          items: { type: string }
        is_active: { type: boolean, default: true }

    WebhookDelivery:
      type: object
      properties:
        id: { type: string }
        webhook_id: { type: string }
        event_id: { type: string }
        event_type: { type: string }
        request_body: { type: string }
        response_status: { type: [integer, "null"] }
        response_body: { type: [string, "null"] }
        attempt: { type: integer }
        succeeded: { type: boolean }
        next_retry_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    WebhookEventEnvelope:
      type: object
      description: |
        Canonical envelope for every webhook event. The body shape varies by `type`; see
        `WebhookEvent` for the discriminated union of typed payloads. Verify the request with
        the HMAC-SHA256 `X-MGPass-Signature` header using your webhook's raw `webhook_secret`.
      required: [id, type, created_at, application_id, data]
      properties:
        id: { type: string }
        type: { type: string }
        created_at: { type: string, format: date-time }
        application_id: { type: string }
        livemode: { type: boolean }
        data: { type: object, additionalProperties: true }

    WebhookEvent:
      oneOf:
        - $ref: '#/components/schemas/EventSubscriptionCreated'
        - $ref: '#/components/schemas/EventSubscriptionActivated'
        - $ref: '#/components/schemas/EventSubscriptionRenewed'
        - $ref: '#/components/schemas/EventSubscriptionPaymentFailed'
        - $ref: '#/components/schemas/EventSubscriptionUnpaid'
        - $ref: '#/components/schemas/EventSubscriptionCancelled'
        - $ref: '#/components/schemas/EventSubscriptionExpired'
        - $ref: '#/components/schemas/EventSubscriptionTrialEnding'
        - $ref: '#/components/schemas/EventSubscriptionPlanChanged'
        - $ref: '#/components/schemas/EventApplicationCreated'
        - $ref: '#/components/schemas/EventApplicationUpdated'
        - $ref: '#/components/schemas/EventApplicationDeleted'
        - $ref: '#/components/schemas/EventApplicationOauthEnabled'
        - $ref: '#/components/schemas/EventApplicationOauthDisabled'
        - $ref: '#/components/schemas/EventApplicationRewardsEnabled'
        - $ref: '#/components/schemas/EventApplicationRewardsDisabled'
        - $ref: '#/components/schemas/EventApplicationSubscriptionsEnabled'
        - $ref: '#/components/schemas/EventApplicationSubscriptionsDisabled'
      discriminator:
        propertyName: type

    EventSubscriptionCreated:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          properties:
            type: { type: string, const: subscription.created }
            data:
              type: object
              properties:
                subscription: { $ref: '#/components/schemas/Subscription' }
                amount: { type: integer }
                currency: { type: string, enum: [GHS, USD] }

    EventSubscriptionActivated:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          properties:
            type: { type: string, const: subscription.activated }
            data:
              type: object
              properties:
                subscription: { $ref: '#/components/schemas/Subscription' }
                amount: { type: integer }
                currency: { type: string, enum: [GHS, USD] }

    EventSubscriptionRenewed:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          properties:
            type: { type: string, const: subscription.renewed }
            data:
              type: object
              properties:
                subscription: { $ref: '#/components/schemas/Subscription' }
                invoice: { $ref: '#/components/schemas/Invoice' }
                amount: { type: integer }
                currency: { type: string, enum: [GHS, USD] }

    EventSubscriptionPaymentFailed:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          properties:
            type: { type: string, const: subscription.payment_failed }
            data:
              type: object
              properties:
                subscription: { $ref: '#/components/schemas/Subscription' }
                payment: { $ref: '#/components/schemas/Payment' }
                amount: { type: integer }
                currency: { type: string, enum: [GHS, USD] }
                attempt: { type: integer }

    EventSubscriptionUnpaid:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          properties:
            type: { type: string, const: subscription.unpaid }
            data:
              type: object
              properties:
                subscription: { $ref: '#/components/schemas/Subscription' }
                amount: { type: integer }
                currency: { type: string, enum: [GHS, USD] }

    EventSubscriptionCancelled:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          properties:
            type: { type: string, const: subscription.cancelled }
            data:
              type: object
              properties:
                subscription: { $ref: '#/components/schemas/Subscription' }
                cancelled_by: { type: string, enum: [user, admin, system] }

    EventSubscriptionExpired:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          properties:
            type: { type: string, const: subscription.expired }
            data:
              type: object
              properties:
                subscription: { $ref: '#/components/schemas/Subscription' }

    EventSubscriptionTrialEnding:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          properties:
            type: { type: string, const: subscription.trial_ending }
            data:
              type: object
              properties:
                subscription: { $ref: '#/components/schemas/Subscription' }
                trial_end: { type: string, format: date-time }

    EventSubscriptionPlanChanged:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          properties:
            type: { type: string, const: subscription.plan_changed }
            data:
              type: object
              properties:
                subscription: { $ref: '#/components/schemas/Subscription' }
                previous_plan_id: { type: string }
                new_plan_id: { type: string }
                proration: { $ref: '#/components/schemas/ProrationPreview' }

    EventApplicationCreated:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          properties:
            type: { type: string, const: application.created }
            data:
              type: object
              properties:
                application: { $ref: '#/components/schemas/Application' }

    EventApplicationUpdated:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          properties:
            type: { type: string, const: application.updated }
            data:
              type: object
              properties:
                application: { $ref: '#/components/schemas/Application' }

    EventApplicationDeleted:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          properties:
            type: { type: string, const: application.deleted }
            data:
              type: object
              properties:
                application_id: { type: string }

    EventApplicationOauthEnabled:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          properties:
            type: { type: string, const: application.oauth.enabled }
            data:
              type: object
              properties:
                application_id: { type: string }
                capability: { $ref: '#/components/schemas/ApplicationOAuthCapability' }

    EventApplicationOauthDisabled:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          properties:
            type: { type: string, const: application.oauth.disabled }
            data:
              type: object
              properties:
                application_id: { type: string }

    EventApplicationRewardsEnabled:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          properties:
            type: { type: string, const: application.rewards.enabled }
            data:
              type: object
              properties:
                application_id: { type: string }
                capability: { $ref: '#/components/schemas/ApplicationRewardsCapability' }

    EventApplicationRewardsDisabled:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          properties:
            type: { type: string, const: application.rewards.disabled }
            data:
              type: object
              properties:
                application_id: { type: string }

    EventApplicationSubscriptionsEnabled:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          properties:
            type: { type: string, const: application.subscriptions.enabled }
            data:
              type: object
              properties:
                application_id: { type: string }
                capability: { $ref: '#/components/schemas/ApplicationSubscriptionsCapability' }

    EventApplicationSubscriptionsDisabled:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          properties:
            type: { type: string, const: application.subscriptions.disabled }
            data:
              type: object
              properties:
                application_id: { type: string }

    ProrationPreview:
      type: object
      properties:
        credit: { type: integer, description: 'Credit applied for unused time on the old plan, in minor units.' }
        charge_amount: { type: integer, description: 'Net amount to charge, in minor units.' }
        currency: { type: string, enum: [GHS, USD] }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        breakdown:
          type: array
          items:
            type: object
            properties:
              description: { type: string }
              amount: { type: integer }
              type: { type: string, enum: [credit, charge] }

    StatsRevenue:
      type: object
      properties:
        currency: { type: string, enum: [GHS, USD] }
        daily_revenue:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              amount: { type: integer, description: 'In minor units.' }
        top_plans:
          type: array
          items:
            type: object
            properties:
              plan_id: { type: string }
              plan_name: { type: string }
              mrr: { type: integer }
              subscriber_count: { type: integer }
        churn_rate_30d: { type: number, description: 'Fraction in [0,1].' }
        arpu_30d: { type: integer, description: 'Average revenue per user (minor units).' }
        refund_volume_30d: { type: integer, description: 'Refunds in minor units (30 days).' }
        active_subscriptions: { type: integer }
        trialing_subscriptions: { type: integer }

    RewardsSummary:
      type: object
      properties:
        user_id: { type: string }
        balance: { type: integer, description: 'Available points.' }
        lifetime_points: { type: integer }
        tier: { type: string }
        tier_progress: { type: number }
        next_tier: { type: [string, "null"] }
        cashback_balance:
          type: object
          properties:
            amount: { type: integer, description: 'In minor units.' }
            currency: { type: string, enum: [GHS] }

    PointsLedgerEntry:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        application_id: { type: [string, "null"] }
        delta: { type: integer, description: 'Positive for credits, negative for debits.' }
        balance_after: { type: integer }
        reason: { type: string }
        event_type: { type: [string, "null"] }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }

    Redemption:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        item_id: { type: string }
        item_name: { type: string }
        points_spent: { type: integer }
        status: { type: string, enum: [pending, fulfilled, cancelled, refunded] }
        fulfilled_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    RewardsRule:
      type: object
      properties:
        id: { type: string }
        application_id: { type: [string, "null"] }
        event_type: { type: string }
        points: { type: integer }
        per_unit_field: { type: [string, "null"] }
        daily_cap: { type: [integer, "null"] }
        monthly_cap: { type: [integer, "null"] }
        conditions: { type: [object, "null"], additionalProperties: true }
        is_active: { type: boolean }

    CatalogItem:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        image_url: { type: [string, "null"], format: uri }
        points_cost: { type: integer }
        stock: { type: [integer, "null"], description: 'Null means unlimited.' }
        required_tier: { type: [string, "null"] }
        is_active: { type: boolean }

    Benefit:
      type: object
      properties:
        id: { type: string }
        tier: { type: string }
        title: { type: string }
        description: { type: string }
        icon: { type: [string, "null"] }
        is_active: { type: boolean }

    CashbackConfig:
      type: object
      properties:
        id: { type: string }
        application_id: { type: string }
        is_enabled: { type: boolean }
        points_per_unit: { type: integer, description: 'Points required for 1 minor unit of cashback.' }
        min_redemption: { type: integer, description: 'Minimum cashback redemption in minor units.' }
        currency: { type: string, enum: [GHS] }
        allowed_networks:
          type: array
          items: { type: string, enum: [MTN, VODAFONE, AIRTELTIGO] }
